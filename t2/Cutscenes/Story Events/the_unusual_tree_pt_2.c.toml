[the_unusual_tree_pt_2]
kind = "gameplay_triggered"
speaker = "caldarus"
local = "Well met, mortal."
prompts = [
	{ local = "Y-you're the guardian dragon?", next = "1" },
	{ local = "Huh, this is a weird dream.", next = "2" },
]

[the_unusual_tree_pt_2.1]
local = "I am $Caldarus$, the Guardian of Mistria. Thank you for repairing my $Shrine$."
next = "4"

[the_unusual_tree_pt_2.2]
local = "..."
next = "3"

[the_unusual_tree_pt_2.3]
local = "Mortal, this is not a dream. Please do not make me regret this conversation."
next = "1"

[the_unusual_tree_pt_2.4]
local = "Ah... I have been asleep since..."
next = "5"

[the_unusual_tree_pt_2.5]
local = "..."
next = "6"

[the_unusual_tree_pt_2.6]
local = "Well, $I cannot seem to remember$, exactly. Even now, my mind is shrouded in fog."
next = "7"

[the_unusual_tree_pt_2.7]
local = "Magical $Essence$ has begun to flow again in Mistria, of that much I am certain."
next = "8"

[the_unusual_tree_pt_2.8]
local = "I ask you to extend your assistance once more, mortal."
next = "9"

[the_unusual_tree_pt_2.9]
local = "I need you to collect this $Essence$ and offer it at my $Shrine$ so that I may regain my strength."
next = "10"

[the_unusual_tree_pt_2.10]
local = "I hereby bestow upon you the ability to sense and collect $Essence$. You should find it naturally when $going about your daily tasks$."
next = "tutorial_prompt"

[the_unusual_tree_pt_2.tutorial_prompt]
no_speaker = true
local = "Would you like to view the $Skill Perk Tutorial$?"
prompts = [{ local = "Yes", next = "11" }, { local = "No", next = "11" }]

[the_unusual_tree_pt_2.11]
local = "I grow tired... Let us speak again tomorrow at my $Shrine$."
prompts = [
	{ local = "I am honored. You can count on me!", next = "12" },
	{ local = "B-but I don't want to!", next = "13" },
]

[the_unusual_tree_pt_2.12]
local = "Sleep now, mortal. We will speak again soon."

[the_unusual_tree_pt_2.13]
local = "As the saying goes, if you do not want to be bound by fate to a dragon, then you should not repair his shrine. Sleep now, mortal."
