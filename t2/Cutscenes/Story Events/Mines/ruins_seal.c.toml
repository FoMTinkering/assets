next = "1"

[break_ruins_seal_pt_3.1]
speaker = "seridia"
portrait = "happy"
local = "^I see that the $Void [Ari]$ now holds the necessary offerings.^"
next = "2"

[break_ruins_seal_pt_3.2]
speaker = "seridia"
portrait = "think"
local = "^Let us keep our distance while you direct it to break the seal.^"
next = "3"

[break_ruins_seal_pt_3.3]
speaker = "seridia"
portrait = "neutral"
local = "^Go on, there is no reason to worry. You are safe.^"
next = "4"

[break_ruins_seal_pt_3.4]
speaker = "seridia"
portrait = "hurt"
local = "^Ah... well done, $Void [Ari]$.^"
next = "5"

[break_ruins_seal_pt_3.5]
speaker = "seridia"
portrait = "sad"
local = "^Thank you for fulfilling your purpose.^"
next = "6"

[break_ruins_seal_pt_3.6]
speaker = "seridia"
portrait = "neutral"
local = "^And thank you, as well.^"
next = "7"

[break_ruins_seal_pt_3.7]
speaker = "seridia"
portrait = "happy"
local = "^You have succeeded in breaking the $Ruins Seal$.^"
next = "8"

[break_ruins_seal_pt_3.8]
speaker = "seridia"
portrait = "sad"
local = "^Be sure to proceed with caution.^"
next = "9"

[break_ruins_seal_pt_3.9]
speaker = "seridia"
portrait = "hurt"
local = "^And remember, we must not burden Lord Caldarus with news of these events.^"
next = "10"

[break_ruins_seal_pt_3.10]
speaker = "seridia"
portrait = "neutral"
local = "^This last chapter of the journey... we shall see it through together.^"
next = "11"

[break_ruins_seal_pt_3.11]
speaker = "seridia"
portrait = "happy"
local = "^I shall stand by you in Lord Caldarus' stead until the $Final Seal$ is broken.^"
next = "12"

[break_ruins_seal_pt_3.12]
speaker = "seridia"
portrait = "neutral"
local = "^Go forth now...^"
next = "13"

[break_ruins_seal_pt_3.13]
speaker = "seridia"
portrait = "neutral_closed"
local = "^We shall meet again in the ruins below.^"
next = "14"

[break_ruins_seal_pt_3.14]
speaker = "seridia"
portrait = "neutral"
local = "^The time of the Dragon's full awakening draws near.^"
