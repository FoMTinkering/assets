	{ local = "You're cute when you're like this.", next = "7" },
	{ local = "You've always been a guide. It's my turn.", next = "8" }
]

[caldarus_ten_hearts.7]
speaker = "caldarus"
portrait = "embarrassed"
local = "Is that so? Perhaps I need not be so shy about sharing, then."
