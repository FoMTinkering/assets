[caldarus_ten_hearts.22]
speaker = "caldarus"
portrait = "caring_special"
local = "You have opened my eyes, and my heart."
next = "23"

[caldarus_ten_hearts.23]
speaker = "caldarus"
portrait = "serious_blush"
local = "I wish for us to always be together, [Ari]. Regardless of lifetime, regardless of form."
next = [
    { target = "24_second", requires = [
