[caldarus_ten_hearts.11]
speaker = "caldarus"
portrait = "think"
local = "I thought you would come to me only when you were in need, as it has always been between myself and mortals."
next = "12"

[caldarus_ten_hearts.12]
speaker = "caldarus"
portrait = "caring_special"
local = "But sometimes you would come to me simply to... talk. And it was in those times that I felt my heart begin to change."
next = "13"

[caldarus_ten_hearts.13]
speaker = "caldarus"
portrait = "sigh"
local = "Before you, I had always thought of my role as that of a caretaker... tending to the garden of Mistria while being held slightly apart."
next = "14"

[caldarus_ten_hearts.14]
speaker = "caldarus"
portrait = "think"
local = "Who I am has always brought with it a certain measure of deference, even worship..."
next = "15"

[caldarus_ten_hearts.15]
speaker = "caldarus"
portrait = "neutral"
local = "And I thought I was happy being only what others needed me to be."
next = "16"

[caldarus_ten_hearts.16]
speaker = "caldarus"
portrait = "smile"
local = "But it is not so. You have shown me that I wish to stand in the garden, too."
prompts = [
	{ local = "It was your guidance that helped me find my place as well.", next = "17" },
	{ local = "Our pact is important, but what really helped me were the times you listened.", next = "17" }
]

[caldarus_ten_hearts.17]
speaker = "caldarus"
portrait = "embarrassed"
local = "Truly? Then it seems it is mutual."
next = "18"

[caldarus_ten_hearts.18]
speaker = "caldarus"
portrait = "unsure_special"
local = "It is undeniable, the ways I have begun to change under your influence."
next = "19"

[caldarus_ten_hearts.19]
speaker = "caldarus"
portrait = "neutral"
local = "Mingling with the townsfolk, learning to cook..."
next = "20"

[caldarus_ten_hearts.20]
speaker = "caldarus"
portrait = "smile"
local = "These are things I would not have allowed myself, once."
next = "21"

[caldarus_ten_hearts.21]
speaker = "caldarus"
portrait = "laugh_special"
local = "But you have shown me the way..."
