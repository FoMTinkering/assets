[caldarus_ten_hearts.9]
speaker = "caldarus"
portrait = "unsure_special"
local = "When you repaired my statue and woke me, my first thought was of Mistria."
next = "10"

[caldarus_ten_hearts.10]
speaker = "caldarus"
portrait = "smile"
local = "And what kismet it was, to form a pact with a soul who instinctively understood my life's purpose."
