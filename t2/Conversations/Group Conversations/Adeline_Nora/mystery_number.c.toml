[mystery_number]
refresh = "2m"
requires = [
	{ any = [{ npc = "adeline" }, { npc = "nora" }] },
	{ adeline_zone = "<nora_zone>" },
	{ any = [
		{ adeline_animation = "write" },
		{ adeline_animation = "write_sit" }
	] },
	{ any = [{ nora_animation = "write_sit" }, { nora_animation = "tap" }] }
]
speaker = "adeline"
portrait = "neutral"
local = "Thanks for your assistance, Nora. My books just weren't adding up."
next = "1"

[mystery_number.1]
speaker = "nora"
portrait = "happy"
local = "Oh, it's my pleasure. No one likes a mystery number!"
next = "2"

[mystery_number.2]
speaker = "nora"
portrait = "think"
local = "Well, Balor maybe."
