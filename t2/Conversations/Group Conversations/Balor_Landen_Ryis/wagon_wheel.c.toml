[wagon_wheel]
refresh = "1y"
requires = [
	{ any = [{ npc = "balor" }, { npc = "landen" }, { npc = "ryis" }] },
	{ balor_zone = "<landen_zone>" },
	{ balor_zone = "<ryis_zone>" },
	{ wagon_needs_repairs = true },
]
writes = [{ wagon_needs_repairs = false }]
speaker = "ryis"
portrait = "neutral"
local = "He needs a new wagon wheel, Uncle."
