[lunch]
refresh = "2m"
requires = [
	{ any = [{ npc = "adeline" }, { npc = "eiland" }, { npc = "elsie" }] },
	{ adeline_zone = "<eiland_zone>" },
	{ adeline_zone = "<elsie_zone>" },
	{ time_of_day = "morning" },
	{ location = "inn", comparator = "!=" },
	{ adeline_is_traveling_to_location = "inn", comparator = "!=" },
	{ eiland_is_traveling_to_location = "inn", comparator = "!=" },
	{ elsie_is_traveling_to_location = "inn", comparator = "!=" },
]
speaker = "elsie"
portrait = "happy"
local = "What would you two like to do for lunch?"
next = "1"

[lunch.1]
speaker = "adeline"
portrait = "neutral"
local = "Oh! We could stop by the Inn and see what the special is."
next = "2"

[lunch.2]
speaker = "eiland"
portrait = "neutral"
local = "Sounds splendid, dessert's on me!"
