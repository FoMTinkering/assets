[pumpkins]
refresh = "3m"
requires = [
	{ any = [{ npc = "hayden" }, { npc = "terithia" }] },
	{ hayden_zone = "<terithia_zone>" },
	{ season = "fall" },
	{ year_time = "2m 7d", comparator = ">=", parser = "date_time" },
]
speaker = "hayden"
portrait = "neutral"
local = "You're welcome to any of the pumpkins I've got growing! I don't think they'll get much bigger."
next = "1"

[pumpkins.1]
speaker = "terithia"
portrait = "happy"
local = "Oh, but what if they do? I want to see just how big they'll get!"
