[walls]
refresh = "2m"
requires = [
	{ any = [{ npc = "eiland" }, { npc = "march" }] },
	{ eiland_zone = "<march_zone>" },
	{ location = "town" },
	{ wall_inspection = true }
]
speaker = "march"
portrait = "neutral"
local = "The walls look good, Eiland. And they held up pretty well during the earthquake, didn't they?"
next = "1"

[walls.1]
speaker = "eiland"
portrait = "think"
local = "Yes. It might be illuminating to look into the history of their construction..."

[walls_2]
refresh = "2m"
requires = [
	{ any = [{ npc = "eiland" }, { npc = "march" }] },
	{ eiland_zone = "<march_zone>" },
	{ location = "town" },
	{ wall_inspection = true }
]
speaker = "eiland"
portrait = "sad"
local = "A flaw? Is it serious?"
next = "1"

[walls_2.1]
speaker = "march"
portrait = "think"
local = "Hm. Nothing urgent, but I'll ask Olric to come out and take a look when he has time."

[walls_3]
refresh = "2m"
requires = [
	{ any = [{ npc = "eiland" }, { npc = "march" }] },
	{ eiland_zone = "<march_zone>" },
	{ location = "town" },
	{ wall_inspection = true }
]
speaker = "march"
portrait = "neutral"
