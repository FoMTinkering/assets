requires = [
	{ any = [{ npc = "dell" }, { npc = "luc" }, { npc = "maple" }] },
	{ dell_zone = "<luc_zone>" },
	{ dell_zone = "<maple_zone>" },
	{ time_of_day = "evening" },
	{ season = "winter" },
	{ any = [{ dell_activity = "drink" }, { dell_activity = "eat" }] },
