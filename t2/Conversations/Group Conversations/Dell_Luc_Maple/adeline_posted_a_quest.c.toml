	{ any = [{ npc = "dell" }, { npc = "luc" }, { npc = "maple" }] },
	{ dell_zone = "town/quest_board_looking" },
	{ luc_zone = "town/quest_board_looking" },
	{ maple_zone = "town/quest_board_looking" },
