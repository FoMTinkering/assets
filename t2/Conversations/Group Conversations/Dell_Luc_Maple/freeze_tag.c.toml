[freeze_tag]
refresh = "2m"
requires = [
	{ any = [{ npc = "dell" }, { npc = "luc" }, { npc = "maple" }] },
	{ dell_zone = "<luc_zone>" },
	{ dell_zone = "<maple_zone>" },
	{ is_inside = false },
	{ any = [{ season = "fall" }, { season = "winter" }] }
]
speaker = "maple"
portrait = "neutral"
local = "I think the rules of freeze tag are that if you get tagged, you have to stand still."
