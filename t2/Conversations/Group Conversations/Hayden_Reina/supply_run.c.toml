[supply_run]
refresh = "never"
requires = [
	{ any = [{ npc = "hayden" }, { npc = "reina" }] },
	{ hayden_zone = "<reina_zone>" },
	{ any = [{ location = "haydens_farm" }, { location = "haydens_house" }] },
	{ hayden_is_at_location = "<hemlock_is_at_location>", comparator = "!=" }
]
writes = [
	{ farm_groceries = true, expires = "1w" },
	{ reina_visited_hayden_farm = true, expires = "2d" }
]
speaker = "reina"
portrait = "neutral"
effect = "sparkles"
local = "Oh, hi [Ari]! I'm doing a supply run for the Inn. We're Hayden's biggest customers!"
next = "1"

[supply_run.1]
speaker = "hayden"
portrait = "neutral"
local = "Did you know? Reina took over the supply run for Hemlock after he hurt his back."
next = "2"

[supply_run.2]
speaker = "hayden"
portrait = "happy"
effect = "drop"
local = "His back got better, but every time Reina brings it up he pretends like he threw it out again."
next = "3"

[supply_run.3]
speaker = "reina"
portrait = "wink"
local = "I don't mind one bit! Mostly I like my dad's terrible acting."

