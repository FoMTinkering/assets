requires = [
	{ any = [{ npc = "balor" }, { npc = "olric" }, { npc = "reina" }] },
	{ balor_zone = "<olric_zone>" },
	{ balor_zone = "<reina_zone>" },
	{ season = "winter" },
]
speaker = "balor"
portrait = "think"
