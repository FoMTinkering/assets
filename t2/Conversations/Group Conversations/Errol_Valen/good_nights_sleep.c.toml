[good_nights_sleep]
refresh = "2m"
requires = [
	{ any = [{ npc = "errol" }, { npc = "valen" }] },
	{ errol_zone = "<valen_zone>" },
]
speaker = "valen"
portrait = "raised_eyebrow"
