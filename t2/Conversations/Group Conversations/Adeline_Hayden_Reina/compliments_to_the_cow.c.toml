[compliments_to_the_cow]
refresh = "2m"
requires = [
	{ any = [{ npc = "adeline" }, { npc = "hayden" }, { npc = "reina" }] },
	{ adeline_zone = "<reina_zone>" },
	{ adeline_zone = "<hayden_zone>" },
	{ adeline_activity = "eat" },
]
speaker = "adeline"
local = "Today's soup is delicious, Reina!"
next = "1"

[compliments_to_the_cow.1]
