[inn_poker]
refresh = "never"
requires = [
	{ any = [
		{ npc = "adeline" },
		{ npc = "balor" },
		{ npc = "celine" },
		{ npc = "hemlock" },
		{ npc = "reina" }
	] },
	{ adeline_playing_poker = true },
	{ balor_playing_poker = true },
	{ celine_playing_poker = true },
	{ hemlock_playing_poker = true },
	{ reina_playing_poker = true },
	{ adeline_zone = "<balor_zone>" },
	{ adeline_zone = "<celine_zone>" },
	{ adeline_zone = "<hemlock_zone>" },
	{ adeline_zone = "<reina_zone>" },
	{ location = "inn" }
]
speaker = "hemlock"
portrait = "neutral"
local = "Celine wins! Wow, that was a nail-biter."
next = "1"

[inn_poker.1]
speaker = "balor"
portrait = "sly"
local = "Glad I folded early. My merchant's instinct was whispering to me."
next = "2"

[inn_poker.2]
speaker = "reina"
portrait = "neutral"
local = "I really thought Adeline was going to take it! How did you know, Celine?"
next = "3"

[inn_poker.3]
speaker = "celine"
portrait = "happy"
effect = "drop"
local = "I kind of got the feeling Adeline was keeping her cards in order, but she didn't rearrange them when she got her last card!"
next = "4"

[inn_poker.4]
speaker = "adeline"
portrait = "mad"
effect = "shock"
local = "Oh gosh... am I too organized?"

