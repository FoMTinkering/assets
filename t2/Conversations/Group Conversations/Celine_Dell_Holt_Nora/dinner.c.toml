	{ dell_was_last_spoken_to = "6h", time = "after", comparator = ">" },
	{ holt_was_last_spoken_to = "6h", time = "after", comparator = ">" },
	{ nora_was_last_spoken_to = "6h", time = "after", comparator = ">" },
