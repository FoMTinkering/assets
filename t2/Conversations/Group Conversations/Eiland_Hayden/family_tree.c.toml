[family_tree]
refresh = "never"
requires = [
	{ any = [{ npc = "eiland" }, { npc = "hayden" }] },
	{ eiland_zone = "<hayden_zone>" },
]
speaker = "eiland"
local = "Hayden, I was going through some of Mistria's older records, and your family's name comes up quite a bit."
next = "1"

[family_tree.1]
speaker = "eiland"
portrait = "think"
local = "You may have one of the longest unbroken family lines in all of Mistria."
next = "2"

[family_tree.2]
speaker = "hayden"
portrait = "think"
local = "You think so? My family's been here for as long as anyone can remember."
next = "3"

[family_tree.3]
speaker = "hayden"
portrait = "happy"
effect = "sparkles"
local = "My gran used to say we've got Mistria's sun and soil in our bones!"
