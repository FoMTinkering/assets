[count_fish]
refresh = "1y"
requires = [
	{ any = [{ npc = "landen" }, { npc = "terithia" }] },
	{ landen_zone = "<terithia_zone>" },
]
speaker = "landen"
portrait = "neutral"
local = "How many fish do you think you've caught in your life?"
next = "1"

[count_fish.1]
speaker = "terithia"
portrait = "wink"
local = "What a question! Why, I suppose I never kept track."
next = "2"

[count_fish.2]
speaker = "terithia"
portrait = "think"
local = "Should I start counting now?"
