[potion_of_night_vision]
refresh = "3m"
requires = [
	{ any = [
		{ npc = "dell" },
		{ npc = "juniper" },
		{ npc = "luc" },
		{ npc = "maple" },
	] },
	{ juniper_babysits = true },
	{ location = "bathhouse" },
	{ dell_zone = "<juniper_zone>" },
	{ dell_zone = "<luc_zone>" },
	{ dell_zone = "<maple_zone>" },
]
speaker = "dell"
portrait = "think"
local = "What are you doing Miss Juniper?"
next = "1"

[potion_of_night_vision.1]
speaker = "juniper"
portrait = "unimpressed"
local = "I'm making a potion of superior night vision."
next = "2"

[potion_of_night_vision.2]
speaker = "maple"
portrait = "think"
local = "Why do you need a potion of super venison?"
next = "3"

[potion_of_night_vision.3]
speaker = "juniper"
portrait = "think"
local = "It will help me see in the dark. Superiorly."
next = "4"

[potion_of_night_vision.4]
speaker = "luc"
portrait = "ugh"
local = "Why does it smell like that?"
next = "5"

[potion_of_night_vision.5]
speaker = "juniper"
portrait = "annoyed"
local = "That's the sulfur."
next = "6"

[potion_of_night_vision.6]
speaker = "maple"
portrait = "ugh"
local = "And are you going to DRINK it?"
next = "7"

[potion_of_night_vision.7]
speaker = "juniper"
portrait = "mad"
local = "No."
next = "8"

[potion_of_night_vision.8]
speaker = "dell"
portrait = "happy"
effect = "sparkles"
local = "Can *I* drink it?"
next = "9"

[potion_of_night_vision.9]
speaker = "juniper"
portrait = "angry_brows"
local = "Tempting, but your mother would absolutely kill me."
