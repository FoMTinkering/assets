[icebox]
refresh = "1y"
requires = [
	{ any = [{ npc = "eiland" }, { npc = "ryis" }] },
	{ eiland_zone = "<ryis_zone>" },
	{ date_time = "2m", comparator = ">=" }
]
speaker = "ryis"
portrait = "think"
local = "So let me get this straight... you want a bookshelf, but for cakes?"
next = "1"

[icebox.1]
speaker = "eiland"
portrait = "neutral"
local = "Precisely! Maybe with some nice inlay on the doors, and a way to keep them temperature controlled."
next = "2"

[icebox.2]
speaker = "ryis"
portrait = "happy"
effect = "drop"
local = "I think you're looking for an icebox, Eiland."