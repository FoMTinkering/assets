[fixer_upper]
refresh = "never"
requires = [
	{ any = [
		{ npc = "adeline" },
		{ npc = "eiland" },
		{ npc = "elsie" },
		{ npc = "errol" },
		{ npc = "valen" }
	] },
	{ adeline_zone = "<eiland_zone>"},
	{ adeline_zone = "<elsie_zone>"},
	{ adeline_zone = "<errol_zone>"},
	{ adeline_zone = "<valen_zone>"},
	{ building = "manor_house" }
]
speaker = "errol"
portrait = "happy"
local = "I must say, the manor has come a long way from when the Baron and Baroness first moved in."
next = "1"

[fixer_upper.1]
speaker = "adeline"
portrait = "neutral"
local = "Really? What was it like?"
next = "2"

[fixer_upper.2]
speaker = "elsie"
portrait = "wink"
local = "A fixer-upper, if memory serves. But the Baron was quite comfortable rolling his sleeves up."
next = "3"

[fixer_upper.3]
speaker = "elsie"
portrait = "think"
local = "I visited that summer, and I remember Wiscar, Landen and Errol all standing shoulder to shoulder as they worked."
next = "4"

[fixer_upper.4]
speaker = "valen"
portrait = "raised_eyebrow"
local = "My father told me stories about that summer! The Baron would come to the Clinic at twilight almost every day, with more and more unlikely injuries."
next = "5"

[fixer_upper.5]
speaker = "eiland"
portrait = "think"
local = "Ohhhh. I guess that's why mom was always hiding the tool box!"
