[louis_style]
refresh = "1y"
requires = [
	{ any = [{ npc = "march" }, { npc = "reina" }, { npc = "ryis" }] },
	{ march_zone = "<reina_zone>" },
	{ march_zone = "<ryis_zone>" },
	{ market_is_back = true },
	{ date_time = "1y", comparator = ">=" },
	{ day_of_the_week = "saturday", comparator = "!=" }
]
speaker = "reina"
portrait = "neutral"
local = "Louis complimented your style the last time I talked to him at the Saturday Market, Ryis."
