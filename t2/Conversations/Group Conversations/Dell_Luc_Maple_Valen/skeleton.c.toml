	{ any = [
		{ npc = "dell" },
		{ npc = "luc" },
		{ npc = "maple" },
		{ npc = "valen" },
	] },
	{ dell_zone = "<luc_zone>" },
	{ dell_zone = "<maple_zone>" },
	{ dell_zone = "<valen_zone>" },
