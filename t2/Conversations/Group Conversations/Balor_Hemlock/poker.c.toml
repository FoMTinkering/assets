[poker]
refresh = "1y"
requires = [
	{ any = [{ npc = "balor" }, { npc = "hemlock" }] },
	{ balor_zone = "<hemlock_zone>" },
	{ balor_playing_poker = true },
	{ hemlock_playing_poker = true },
	{ location = "inn" }
]
actions = [
	{ bark = { bark = "ellipses", npc = "balor" } },
	{ bark = { bark = "ellipses", npc = "hemlock" } },
]
