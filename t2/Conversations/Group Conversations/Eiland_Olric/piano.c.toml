[piano]
refresh = "never"
requires = [
	{ any = [{ npc = "eiland" }, { npc = "olric" }] },
	{ any = [
		{ eiland_is_at = "manor_house_entry/Piano Bench Seat" },
		{ eiland_is_at = "manor_house_entry/Piano Teacher" },
	] },
	{ any = [
		{ olric_is_at = "manor_house_entry/Piano Bench Seat" },
		{ olric_is_at = "manor_house_entry/Piano Teacher" },
	] },
	{ olric_piano_prodigy = false }
]
writes = [{ olric_piano_lessons = true }]
speaker = "eiland"
portrait = "neutral"
local = "Why the sudden interest in learning piano, Olric?"
next = "1"

[piano.1]
speaker = "olric"
portrait = "think"
effect = "music_notes"
local = "I didn't know I liked mining until I started, and so I got to thinking... what else would I like if I tried it?"
next = "2"

[piano.2]
speaker = "olric"
portrait = "happy"
local = "Life is about the journey, you know?"

[piano_2]
refresh = "never"
requires = [
	{ any = [{ npc = "eiland" }, { npc = "olric" }] },
	{ olric_is_at = "manor_house_entry/Piano Bench Seat" },
	{ eiland_is_at = "manor_house_entry/Piano Teacher" },
	{ olric_piano_lessons = true }
]
