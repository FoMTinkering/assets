[great_job]
refresh = "1y"
requires = [
	{ any = [{ npc = "adeline" }, { npc = "eiland" }, { npc = "errol" }] },
	{ adeline_zone = "<eiland_zone>" },
	{ adeline_zone = "<errol_zone>" },
	{ building = "museum" },
	{ museum_total_count = 30, comparator = ">=" }
]
speaker = "adeline"
portrait = "neutral"
local = "I've been chatting with the townsfolk, and they're all in love with the Museum. Wonderful work, you two."
