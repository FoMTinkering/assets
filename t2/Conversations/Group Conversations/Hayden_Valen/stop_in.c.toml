	{ any = [{ npc = "hayden" }, { npc = "valen" }] },
	{ hayden_zone = "<valen_zone>" },
	{ location = "clinic_f1" },
	{ hayden_is_at = "clinic_f1/Top Bed", comparator = "!=" },
