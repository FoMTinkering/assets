[fancy_seeds]
refresh = "1y"
requires = [
	{ any = [{ npc = "balor" }, { npc = "celine" }] },
	{ balor_zone = "<celine_zone>" },
]
speaker = "balor"
portrait = "neutral"
local = "Instead of calling them seeds from your garden, how about calling them something more memorable?"
next = "1"

[fancy_seeds.1]
speaker = "celine"
portrait = "think"
local = "Oh, like... top shelf country fresh organically grown heirloom seeds?"
next = "2"

[fancy_seeds.2]
speaker = "balor"
portrait = "mad"
effect = "shock"
local = "Wow, you're a natural!"
next = "3"

[fancy_seeds.3]
speaker = "celine"
portrait = "happy"
local = "Haha, I'm my mother's daughter!"
