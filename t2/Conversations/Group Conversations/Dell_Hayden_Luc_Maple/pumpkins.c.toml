[pumpkins]
refresh = "3m"
requires = [
	{ any = [
		{ npc = "dell" },
		{ npc = "hayden" },
		{ npc = "luc" },
		{ npc = "maple" }
	] },
	{ dell_routine = "pumpkin_patch" },
	{ luc_routine = "pumpkin_patch" },
	{ maple_routine = "pumpkin_patch" },
	{ hayden_routine = "hayden_farm_work_pumpkin_patch" },
	{ season = "fall" },
	{ year_time = "2m 7d", comparator = ">=", parser = "date_time" },
]
speaker = "dell"
portrait = "mad"
local = "Look at this pumpkin! It's so big!"
next = "1"

[pumpkins.1]
speaker = "luc"
portrait = "mad"
local = "This one's so round! And look, the symmetry..."
next = "2"

[pumpkins.2]
speaker = "maple"
portrait = "mad"
local = "And this pumpkin's so orange! Mister Hayden, how'd you get them so big and round and orange?"
next = "3"

[pumpkins.3]
speaker = "hayden"
portrait = "wink"
local = "Well now, that's a farmer's secret!"

