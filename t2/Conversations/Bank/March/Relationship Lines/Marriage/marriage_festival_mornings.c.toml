#SPRING FESTIVAL
[spring_festival]
priority = "max"
refresh = "3m"
requires = [
	{ npc = "march" },
	{ time_of_day = "morning" },
	{ season = "spring" },
	{ spring_festival_date = "1d", time = "after" },
	{ march_is_spouse = true },
	{ any = [{ location = "farm" }, { building = "player_home" }] },
	{ march_morning_greeting = false }
]
writes = [{ march_morning_greeting = true, expires = "6h" }]
actions = [{ bark = { bark = "cute_face", npc = "march" } }]
portrait = "eight_heart_think"
local = "Morning, [Ari]... it's the $Spring Festival$ today, isn't it?"
next = "1"


[spring_festival.1]
portrait = "happy"
local = "I've been seeing you collect $Breath of Spring$ all over the farm... "
next = "2"


[spring_festival.2]
portrait = "wink"
local = "You're going to clobber the competition this year."


