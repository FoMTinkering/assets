[eiland_daydreams]
refresh = "never"
actions = [
	{ bark = { bark = "ellipses", npc = "errol" } }
]
requires = [
	{ npc = "errol" },
	{ date_time = "1d", comparator = ">" },
	{ date_time = "28d", comparator = "<" },
	{ errol_zone = "<eiland_zone>", comparator = "!=" }
]
portrait = "neutral"
local = "Eiland has always had a tremendous interest in history."
next = "1"

[eiland_daydreams.1]
portrait = "think"
local = "But he... doesn't always focus on the present moment."
next = "2"

[eiland_daydreams.2]
portrait = "embarrassed"
local = "Case in point, I noticed today that he accidentally filed away some pottery fragments into my desk's snack drawer."
next = "3"

[eiland_daydreams.3]
portrait = "happy"
local = "Don't be surprised if you catch him lost in a daydream. That's just how he is."
