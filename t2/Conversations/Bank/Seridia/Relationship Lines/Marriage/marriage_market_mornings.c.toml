# DARCY
[market_darcy]
priority = "max"
refresh = "2m"
requires = [
	{ npc = "seridia" },
	{ time_of_day = "morning" },
	{ day_of_the_week = "saturday" },
	{ seridia_is_spouse = true },
	{ any = [{ location = "farm" }, { building = "player_home" }] },
	{ seridia_morning_greeting = false }
]
writes = [{ seridia_morning_greeting = true, expires = "6h" }]
actions = [{ bark = { bark = "cute_face", npc = "seridia" } }]
portrait = "closed_eyes"
local = "Saturday comes again... and with it, the Market."
next = "1"


[market_darcy.1]
portrait = "think"
local = "From where does Darcy conjure her coffees and cakes?"
next = "2"

[market_darcy.2]
portrait = "sinister"
local = "Perhaps today she will tell me her secrets."

