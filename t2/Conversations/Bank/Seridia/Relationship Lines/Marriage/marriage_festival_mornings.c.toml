#SPRING FESTIVAL
[spring_festival]
priority = "max"
refresh = "3m"
requires = [
	{ npc = "seridia" },
	{ time_of_day = "morning" },
	{ season = "spring" },
	{ spring_festival_date = "1d", time = "after" },
	{ seridia_is_spouse = true },
	{ any = [{ location = "farm" }, { building = "player_home" }] },
	{ seridia_morning_greeting = false }
]
writes = [{ seridia_morning_greeting = true, expires = "6h" }]
actions = [{ bark = { bark = "cute_face", npc = "seridia" } }]
portrait = "smile"
local = "The $Spring Festival$ is upon us..."
next = "1"


[spring_festival.1]
portrait = "sly"
local = "Come, let us see what chaos this flower-picking tournament has brought upon the townsfolk."


