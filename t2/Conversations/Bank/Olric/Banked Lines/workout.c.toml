[workout]
refresh = "1y"
requires = [
	{ npc = "olric" },
	{ any = [
		{ olric_routine = "full_body_workout" },
		{ olric_routine = "arm_day" },
		{ olric_routine = "leg_day" }
	] }
]
portrait = "neutral"
local = "Oh, hey pal. You caught me in the middle of my reps."
next = "1"

[workout.1]
portrait = "happy"
effect = "sparkles"
local = "Uh-oh, I lost count! Better start over."

[workout_2]
refresh = "2m"
