		{ olric_routine = "full_body_workout" },
		{ olric_routine = "arm_day" },
		{ olric_routine = "leg_day" }
	] },
	{ date_time = "2m", comparator = ">=" }
]
portrait = "neutral"
local = "Forty one... Forty two... Oh, [Ari]! Do some reps with me!"
next = "1"

[workout_2.1]
portrait = "think"
local = "Hmm, should I go back and start at one?"

