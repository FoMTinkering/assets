#SPRING FESTIVAL
[spring_festival]
priority = "max"
refresh = "3m"
requires = [
	{ npc = "ryis" },
	{ time_of_day = "morning" },
	{ season = "spring" },
	{ spring_festival_date = "1d", time = "after" },
	{ ryis_is_spouse = true },
	{ any = [{ location = "farm" }, { building = "player_home" }] },
	{ ryis_morning_greeting = false }
]
writes = [{ ryis_morning_greeting = true, expires = "6h" }]
actions = [{ bark = { bark = "cute_face", npc = "ryis" } }]
portrait = "neutral"
local = "Morning, [Ari]. It's a beautiful day for a festival!"
next = "1"


[spring_festival.1]
portrait = "wink"
local = "You've been collecting lots of $Breath of Spring$, right?"
next = "2"


[spring_festival.2]
portrait = "happy"
local = "I just know you're gonna leave the competition in the dust."


