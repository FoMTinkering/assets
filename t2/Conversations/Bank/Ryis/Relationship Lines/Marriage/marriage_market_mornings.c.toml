# DARCY
[market_darcy]
priority = "max"
refresh = "2m"
requires = [
	{ npc = "ryis" },
	{ time_of_day = "morning" },
	{ day_of_the_week = "saturday" },
	{ ryis_is_spouse = true },
	{ any = [{ location = "farm" }, { building = "player_home" }] },
	{ ryis_morning_greeting = false }
]
writes = [{ ryis_morning_greeting = true, expires = "6h" }]
actions = [{ bark = { bark = "cute_face", npc = "ryis" } }]
portrait = "neutral"
local = "Morning! You thinking of heading over to the Saturday Market?"
next = "1"


[market_darcy.1]
portrait = "happy"
local = "I gotta see what kind of blend Darcy is using for her =Iced Coffee= this week."


