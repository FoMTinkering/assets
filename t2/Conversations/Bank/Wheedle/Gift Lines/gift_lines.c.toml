# Hated gift
[criminal_confession]
kind = "gift"
requires = [
	{ npc = "wheedle" },
	{ gift_desire = "hated" },
	{ gift_given = "criminal_confession" }
]
portrait = "mad"
local = "A $Criminal Confession$! This isn't mine, who said it was?"
next = "1"

[criminal_confession.1]
portrait = "happy"
effect = "drop"
local = "I'll take this, for... safekeeping."
next = "2"

[criminal_confession.2]
portrait = "think"
local = "And perhaps, for kindling..."

