[fortune_1]
refresh = "1y"
requires = [
	{ npc = "stillwell" },
	{ day_of_the_week = "saturday" },
	{ location = "town" },
	{ stillwell_is_at = "town/Stillwell" },
	{ gold = 100, comparator = ">=" }
]
local = "A fortune can be yours for a mere hundred tesserae..."
prompts = [
	{ local = "I'll take it.", next = "1" },
	{ local = "No thanks.", next = "5" }
]

[fortune_1.1]
actions = [{ gold = -100 }]
local = "Money, Friendship or Love... I'll peer into the void and pluck out a fortune just for you, [Ari]."
prompts = [
	{ local = "Money.", next = "2" },
	{ local = "Friendship.", next = "3" },
	{ local = "Love.", next = "4" }
]

[fortune_1.2]
portrait = "mad"
effect = "sparkles_dark"
local = "I see it... a golden shimmer at your shoulder, a season of ambition."

[fortune_1.3]
portrait = "happy"
effect = "sparkles_dark"
local = "All around, the trees form a canopy to keep you in their shade. It's a time for gratitude."

[fortune_1.4]
portrait = "mad"
effect = "sparkles_dark"
local = "I'm having a vision... of roses in bloom, a cardinal tapestry that never wilts."

[fortune_1.5]
portrait = "think"
local = "I knew you would decline, but fate decreed that the question still be asked..."

