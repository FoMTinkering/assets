[greeting_ari]
priority = "max"
refresh = "never"
requires = [
	{ npc = "stillwell" },
	{ stillwell_has_met = false },
]
writes = [{ stillwell_has_met = true }]
actions = [{ bark = { bark = "cute_face", npc = "stillwell" } }]
can_talk_after = true
portrait = "neutral"
local = "Hey [Ari]. Hmm? No, we haven't met before."
next = "1"

[greeting_ari.1]
portrait = "think"
local = "Me? The name's Stillwell. I can see the past, present, and future. All at once. It's a lot."
next = "2"

[greeting_ari.2]
portrait = "closed_eyes"
local = "I've come to Mistria on urgent business..."
next = "3"

[greeting_ari.3]
portrait = "mad"
effect = "sparkles_dark"
local = "The fate of Aldaria... perhaps even the fate of the world is at stake!"
next = "4"

[greeting_ari.4]
portrait = "closed_eyes"
local = "As you well know, the $Magic$ flowing from the $Gate Between Worlds$ continues to spawn $Monsters$ underground."
next = "5"

[greeting_ari.5]
portrait = "sad"
local = "Without your help to keep them in check, any number of terrible calamities may come to pass."
next = "6"

[greeting_ari.6]
portrait = "closed_eyes"
local = "Trust me... we must prevent those alternate timelines at all costs."
next = "7"

[greeting_ari.7]
portrait = "think"
local = "See the $Mission Board$ over there?"
next = "8"

[greeting_ari.8]
portrait = "neutral"
local = "I'll update it with $Missions$ for you as I come to see these potential futures."
prompts = [{ local = "Wait... what's your booth for, then?", next = "9" }, { local = "Why are you at the Saturday market, though?", next = "11"}]

[greeting_ari.9]
portrait = "think"
local = "My... booth?"
next = "10"

[greeting_ari.10]
portrait = "sad"
local = "To sell fortunes to the villagers, of course."
next = "13"

[greeting_ari.11]
portrait = "think"
local = "With this booth, you mean?"
next = "12"

[greeting_ari.12]
portrait = "neutral"
local = "I'll sell fortunes to the villagers, of course."
next = "13"

[greeting_ari.13]
portrait = "ugh"
local = "A guy's gotta make a living."
next = "14"

[greeting_ari.14]
portrait = "think"
effect = "drop"
local = "Saving the world, while critical, doesn't pay my rent."
next = "15"

[greeting_ari.15]
portrait = "neutral"
local = "In any case, I'm looking forward to working with you."
next = "16"

[greeting_ari.16]
portrait = "closed_eyes"
local = "And yes, I do mean that literally."
next = "17"

[greeting_ari.17]
portrait = "sad"
local = "Thank you in advance for your assistance."