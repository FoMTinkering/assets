actions = [{ bark = { bark = "cute_face", npc = "adeline" } }]
portrait = "neutral"
local = "I'm definitely in the mood for some =Coffee=."
next = "1"


[market_darcy.1]
portrait = "happy"
local = "I wonder which roasts Darcy will have at her booth today..."


