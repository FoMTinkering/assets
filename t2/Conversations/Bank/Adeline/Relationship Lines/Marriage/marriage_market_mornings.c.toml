# DARCY
[market_darcy]
priority = "max"
refresh = "2m"
requires = [
	{ npc = "adeline" },
	{ time_of_day = "morning" },
	{ day_of_the_week = "saturday" },
	{ adeline_is_spouse = true },
	{ any = [{ location = "farm" }, { building = "player_home" }] },
	{ adeline_morning_greeting = false }
]
