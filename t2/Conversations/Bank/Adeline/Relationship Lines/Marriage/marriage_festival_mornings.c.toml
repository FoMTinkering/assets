#SPRING FESTIVAL
[spring_festival]
priority = "max"
refresh = "3m"
requires = [
	{ npc = "adeline" },
	{ time_of_day = "morning" },
	{ season = "spring" },
	{ spring_festival_date = "1d", time = "after" },
	{ adeline_is_spouse = true },
	{ any = [{ location = "farm" }, { building = "player_home" }] },
	{ adeline_morning_greeting = false }
]
writes = [{ adeline_morning_greeting = true, expires = "6h" }]
actions = [{ bark = { bark = "heart", npc = "adeline" } }]
portrait = "happy"
local = "Morning, [Ari]! Happy $Spring Festival$ day!"
next = "1"

[spring_festival.1]
portrait = "neutral"
local = "Nora said everything is set, so today should go very smoothly."
next = "2"

[spring_festival.2]
portrait = "wink"
local = "Let's enjoy ourselves!"


