# Hated gift
[monster_mash]
kind = "gift"
requires = [
	{ npc = "taliferro" },
	{ gift_desire = "hated" },
	{ gift_given = "monster_mash" }
]
portrait = "happy"
effect = "angry"
local = "What do you even call this dish? $Monster Mash$?"
next = "1"

[monster_mash.1]
portrait = "mad"
local = "Absolutely disgusting. Was it made with real monsters?"
next = "2"

[monster_mash.2]
portrait = "ugh"
local = "It was??"

