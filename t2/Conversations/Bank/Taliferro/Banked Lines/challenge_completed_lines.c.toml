[rice_ball_march]
refresh = "1y"
requires = [
	{ npc = "taliferro" },
	{ quest_rice_ball_challenge_complete = true },
	{ taliferro_routine = "taliferro_packing", comparator = "!=" },
]
writes = [{ cc_m = true, expires = "4d" }]
portrait = "neutral"
local = "That blacksmith with the attitude, March... he submitted his entry for my $Rice Ball$ Challenge."
