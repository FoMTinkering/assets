	{ npc = "celine" },
	{ any = [
		{ celine_animation = "book_sit" },
		{ celine_animation = "book_stand" }
	] },
	{ date_time = "1y", comparator = ">=" },
	{ celine_zone = "<dell_zone>", comparator = "!=" },
