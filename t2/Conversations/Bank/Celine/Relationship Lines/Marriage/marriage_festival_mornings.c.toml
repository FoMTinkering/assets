#SPRING FESTIVAL
[spring_festival]
priority = "max"
refresh = "3m"
requires = [
	{ npc = "celine" },
	{ time_of_day = "morning" },
	{ season = "spring" },
	{ spring_festival_date = "1d", time = "after" },
	{ celine_is_spouse = true },
	{ any = [{ location = "farm" }, { building = "player_home" }] },
	{ celine_morning_greeting = false }
]
writes = [{ celine_morning_greeting = true, expires = "6h" }]
actions = [{ bark = { bark = "cute_face", npc = "celine" } }]
portrait = "happy"
local = "Good morning, [Ari]! Happy $Spring Festival$!"
next = "1"


[spring_festival.1]
portrait = "think"
local = "I worked super hard gathering $Breath of Spring$ this year..."
next = "2"


[spring_festival.2]
portrait = "wink"
local = "So don't get your hopes up! We might be married, but I won't go easy on you... Hehe."


