# DARCY
[market_darcy]
priority = "max"
refresh = "2m"
requires = [
	{ npc = "celine" },
	{ time_of_day = "morning" },
	{ day_of_the_week = "saturday" },
	{ celine_is_spouse = true },
	{ any = [{ location = "farm" }, { building = "player_home" }] },
	{ celine_morning_greeting = false }
]
writes = [{ celine_morning_greeting = true, expires = "6h" }]
actions = [{ bark = { bark = "cute_face", npc = "celine" } }]
portrait = "neutral"
local = "I woke up wanting something sweet this morning..."
next = "1"


[market_darcy.1]
portrait = "think"
local = "Darcy will be at the Market, right?"
next = "2"

[market_darcy.2]
portrait = "happy"
local = "I want to see what desserts she's got today!"


