#SPRING FESTIVAL
[spring_festival]
priority = "max"
refresh = "3m"
requires = [
	{ npc = "balor" },
	{ time_of_day = "morning" },
	{ season = "spring" },
	{ spring_festival_date = "1d", time = "after" },
	{ balor_is_spouse = true },
	{ any = [{ location = "farm" }, { building = "player_home" }] },
	{ balor_morning_greeting = false }
]
writes = [{ balor_morning_greeting = true, expires = "6h" }]
actions = [{ bark = { bark = "heart", npc = "balor" } }]
portrait = "neutral"
local = "Nora was happy that I got all the supplies for the $Spring Festival$ in early..."
next = "1"

[spring_festival.1]
portrait = "happy"
local = "So now you and I can enjoy the festival to our heart's content!"


