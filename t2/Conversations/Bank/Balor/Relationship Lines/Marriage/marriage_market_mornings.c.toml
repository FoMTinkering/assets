# DARCY
[market_darcy]
priority = "max"
refresh = "2m"
requires = [
	{ npc = "balor" },
	{ time_of_day = "morning" },
	{ day_of_the_week = "saturday" },
	{ balor_is_spouse = true },
	{ any = [{ location = "farm" }, { building = "player_home" }] },
	{ balor_morning_greeting = false }
]
writes = [{ balor_morning_greeting = true, expires = "6h" }]
actions = [{ bark = { bark = "cute_face", npc = "balor" } }]
portrait = "neutral"
local = "Today's the Saturday Market, isn't it?"
next = "1"


[market_darcy.1]
portrait = "think"
local = "I want to take a peek at whatever $Coffee$ Darcy's selling..."
next = "2"

[market_darcy.2]
portrait = "neutral"
local = "I've been hoping to figure out where she sources her beans from."

