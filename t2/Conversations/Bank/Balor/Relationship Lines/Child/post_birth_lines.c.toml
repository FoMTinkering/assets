# post birth baby lines
[post_birth_0]
priority = "max"
refresh = "never"
requires = [
	{ npc = "balor" },
	{ any = [{ location = "farm" }, { building = "player_home" }] },
	{ balor_is_spouse = true },
	{ child_born_today = true },
	{ child_0_status = "infant" },
	{ child_born_bump = true }
]
actions = [{ bark = { bark = "heart", npc = "balor" } }]
portrait = "happy_blush"
local = "Isn't he precious? Our own sweet little boy."
next = "1"

[post_birth_0.1]
portrait = "embarrassed"
local = "It suddenly feels like there's nothing in the world I wouldn't do for [child_0]. Is it normal for a parent to feel this way?"
next = "2"

[post_birth_0.2]
portrait = "happy"
local = "It's a... wonderful feeling."
next = "3"

[post_birth_0.3]
portrait = "embarrassed"
local = "Our little family. I love you, [Ari]."

