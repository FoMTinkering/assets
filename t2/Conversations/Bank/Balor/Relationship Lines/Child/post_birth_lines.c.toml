]
actions = [{ bark = { bark = "heart", npc = "balor" } }]
portrait = "think"
local = "Growing up, I didn't have a lot of choices... I'd like things to be better for [child_0]. A lot better."
next = "1"

[post_birth_1.1]
portrait = "happy"
