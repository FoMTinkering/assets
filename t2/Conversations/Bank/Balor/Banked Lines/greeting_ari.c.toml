	{ npc = "balor" },
	{ date_time = "2d", comparator = "<=" },
	{ balor_has_met = true },
]
portrait = "neutral"
local = "Hey! I'm glad I bumped into you. I'd forgotten to mention..."
next = "1"

[greeting_ari.1]
