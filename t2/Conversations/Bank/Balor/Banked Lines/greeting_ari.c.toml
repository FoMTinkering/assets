[greeting_ari.2]
portrait = "neutral"
local = "I'll pick up your shipments and leave your payment overnight."
next = "3"

[greeting_ari.3]
portrait = "wink"
local = "The shops in this town depend on the stock I procure for them, so we're all looking forward to your business."
