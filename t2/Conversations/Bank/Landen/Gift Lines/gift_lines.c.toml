# Hated gift
[roly_poly]
kind = "gift"
requires = [
	{ npc = "landen" },
	{ gift_desire = "hated" },
	{ gift_given = "roly_poly" }
]
portrait = "mad"
effect = "shock"
local = "A $Roly Poly$? Errol used to give me those when we were kids! I didn't like it then, and I don't like it now!"

