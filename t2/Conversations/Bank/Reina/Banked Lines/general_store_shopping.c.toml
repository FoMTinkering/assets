[general_store_shopping]
refresh = "1m"
requires = [
	{ npc = "reina" },
	{ any = [{ time_of_day = "morning" }, { time_of_day = "afternoon" }] },
	{ reina_routine = "general_store_shopping" }
]
portrait = "neutral"
local = "I was missing a few ingredients in the kitchen, so I popped on over. It's so convenient being just down the street!"

[general_store_shopping_2]
refresh = "3m"
requires = [
	{ npc = "reina" },
	{ date_time = "1y", comparator = ">=" },
	{ reina_routine = "general_store_shopping" }
]
portrait = "neutral"
local = "Maple and Luc keep talking about how much they liked the last tart I made, so I thought I'd check out what fruits the General Store has in stock."

[general_store_shopping_3]
refresh = "3m"
requires = [
	{ npc = "reina" },
	{ date_time = "1y", comparator = ">=" },
	{ reina_routine = "general_store_shopping" },
	{ season = "winter" }
]
portrait = "neutral"
local = "Valen told me that =Garlic= is a warming food, so I'm adding a bunch to tonight's special!"

[general_store_shopping_4]
refresh = "2m"
requires = [{ npc = "reina" }, { reina_routine = "general_store_shopping" }]
portrait = "neutral"
local = "I can't believe I was one potato short! And so, here I am."

[general_store_shopping_5]
refresh = "3m"
requires = [
	{ npc = "reina" },
	{ reina_routine = "general_store_shopping" },
	{ season = "winter" }
]
