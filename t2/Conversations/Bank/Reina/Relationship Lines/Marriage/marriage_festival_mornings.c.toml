#SPRING FESTIVAL
[spring_festival]
priority = "max"
refresh = "3m"
requires = [
	{ npc = "reina" },
	{ time_of_day = "morning" },
	{ season = "spring" },
	{ spring_festival_date = "1d", time = "after" },
	{ reina_is_spouse = true },
	{ any = [{ location = "farm" }, { building = "player_home" }] },
	{ reina_morning_greeting = false }
]
writes = [{ reina_morning_greeting = true, expires = "6h" }]
actions = [{ bark = { bark = "cute_face", npc = "reina" } }]
portrait = "neutral"
local = "Morning, [Ari]! Excited for the $Spring Festival$?"
next = "1"


[spring_festival.1]
portrait = "happy"
local = "Do you think you have enough $Breath of Spring$ to bring home the gold this year?"
next = "2"


[spring_festival.2]
portrait = "wink"
local = "I'll be cheering for you!"


