	{ npc = "juniper" },
	{ any = [
		{ juniper_routine = "eastern_road_foraging_north" },
		{ juniper_routine = "haydens_farm_foraging" }
	] }
]
portrait = "neutral"
local = "Foraging is good in Mistria, isn't it? The soil supports all kinds of wild plants, throughout the seasons."
