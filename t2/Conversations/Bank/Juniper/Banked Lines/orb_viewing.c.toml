[orb_viewing]
refresh = "2m"
requires = [
	{ npc = "juniper" },
	{ juniper_is_at = "bathhouse_bedroom/Crystal Ball Seat" },
]
portrait = "unimpressed"
local = "Sigh. I can view untold dimensions with this orb, and not one of them is showing anything interesting."

[orb_viewing_2]
refresh = "2m"
requires = [
	{ npc = "juniper" },
	{ juniper_is_at = "bathhouse_bedroom/Crystal Ball Seat" },
]
