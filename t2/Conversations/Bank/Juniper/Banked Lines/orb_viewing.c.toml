		{ location = "narrows" },
		{ juniper_is_at = "bathhouse_bedroom/Crystal Ball Seat" },
	] },
	{ quest_unlocking_the_mines_pt_2_complete = true },
	{ juniper_heart_level = 8, comparator = "<" }
]
portrait = "think"
local = "Many of the leylines I've discovered seem to converge on the Narrows. And the Mines, I suspect."
