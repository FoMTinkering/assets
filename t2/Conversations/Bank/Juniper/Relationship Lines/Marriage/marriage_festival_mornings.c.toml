#SPRING FESTIVAL
[spring_festival]
priority = "max"
refresh = "3m"
requires = [
	{ npc = "juniper" },
	{ time_of_day = "morning" },
	{ season = "spring" },
	{ spring_festival_date = "1d", time = "after" },
	{ juniper_is_spouse = true },
	{ any = [{ location = "farm" }, { building = "player_home" }] },
	{ juniper_morning_greeting = false }
]
writes = [{ juniper_morning_greeting = true, expires = "6h" }]
actions = [{ bark = { bark = "heart", npc = "juniper" } }]
portrait = "neutral"
local = "Today's the $Spring Festival$..."
next = "1"

[spring_festival.1]
portrait = "happy_blush"
local = "I'm looking forward to buying some seasonal treats!"


