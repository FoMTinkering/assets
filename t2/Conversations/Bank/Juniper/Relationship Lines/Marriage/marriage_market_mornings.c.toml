# DARCY
[market_darcy]
priority = "max"
refresh = "2m"
requires = [
	{ npc = "juniper" },
	{ time_of_day = "morning" },
	{ day_of_the_week = "saturday" },
	{ juniper_is_spouse = true },
	{ any = [{ location = "farm" }, { building = "player_home" }] },
	{ juniper_morning_greeting = false }
]
writes = [{ juniper_morning_greeting = true, expires = "6h" }]
actions = [{ bark = { bark = "cute_face", npc = "juniper" } }]
portrait = "neutral"
local = "Saturday morning... Saturday Market day!"
next = "1"

[market_darcy.1]
portrait = "sly"
local = "Do you think Darcy will draw something cute on my =Latte= again? I hope so..."

