# Hated gift
[garlic]
kind = "gift"
requires = [
	{ npc = "henrietta" },
	{ gift_desire = "hated" },
	{ gift_given = "garlic" }
]
local = "(Henrietta doesn't like the smell of garlic one bit, her clucks seem to be scolding you.)"

