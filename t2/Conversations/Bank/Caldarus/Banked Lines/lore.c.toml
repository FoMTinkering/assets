[grove_of_rest]
refresh = "never"
requires = [
	{ npc = "caldarus" },
	{ caldarus_is_human = true },
	{ any = [{ location = "deep_woods" }, { location = "caldarus_house" }] }
]
portrait = "neutral"
local = "The $Grove of Rest$ lies to the west of here."
next = "1"

[grove_of_rest.1]
portrait = "think"
local = "It is an ancient custom, to plant a tree when a human passes on."
next = "2"

[grove_of_rest.2]
portrait = "neutral"
local = "A stone marker is attached to the sapling at the burial site, allowing the stone to integrate and grow upward with the tree over time..."
next = "3"

[grove_of_rest.3]
portrait = "smile"
local = "It represents the ascension of the spirit into its next life."

