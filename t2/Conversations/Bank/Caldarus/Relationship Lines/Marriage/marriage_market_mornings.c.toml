# DARCY
[market_darcy]
priority = "max"
refresh = "2m"
requires = [
	{ npc = "caldarus" },
	{ time_of_day = "morning" },
	{ day_of_the_week = "saturday" },
	{ caldarus_is_spouse = true },
	{ any = [{ location = "farm" }, { building = "player_home" }] },
