#SPRING FESTIVAL
[spring_festival]
priority = "max"
refresh = "3m"
requires = [
	{ npc = "caldarus" },
	{ time_of_day = "morning" },
	{ season = "spring" },
	{ spring_festival_date = "1d", time = "after" },
	{ caldarus_is_spouse = true },
	{ any = [{ location = "farm" }, { building = "player_home" }] },
	{ caldarus_morning_greeting = false }
]
writes = [{ caldarus_morning_greeting = true, expires = "6h" }]
actions = [{ bark = { bark = "cute_face", npc = "caldarus" } }]
portrait = "smile"
local = "Have you been collecting $Breath of Spring$ for the $Spring Festival$?"
next = "1"


[spring_festival.1]
portrait = "happy"
local = "I have as well... but I do not believe I am as adept at foraging as you."
next = "2"


[spring_festival.2]
portrait = "laugh"
local = "I am curious to see who triumphs this year. Perhaps there will be an upset."


