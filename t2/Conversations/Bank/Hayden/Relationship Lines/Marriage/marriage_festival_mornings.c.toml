#SPRING FESTIVAL
[spring_festival]
priority = "max"
refresh = "3m"
requires = [
	{ npc = "hayden" },
	{ time_of_day = "morning" },
	{ season = "spring" },
	{ spring_festival_date = "1d", time = "after" },
	{ hayden_is_spouse = true },
	{ any = [{ location = "farm" }, { building = "player_home" }] },
	{ hayden_morning_greeting = false }
]
writes = [{ hayden_morning_greeting = true, expires = "6h" }]
actions = [{ bark = { bark = "cute_face", npc = "hayden" } }]
portrait = "neutral_arm_down"
local = "I spent the whole morning thinking about the $Spring Festival$..."
next = "1"


[spring_festival.1]
portrait = "happy_fist"
local = "I'm really looking forward to seeing all the flowers this year!"


