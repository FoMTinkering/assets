[breakfast]
refresh = "2m"
requires = [{ npc = "valen" }, { time_of_day = "morning" }]
actions = [{ item = "hard_boiled_egg" }]
portrait = "neutral"
local = "Did you eat a balanced breakfast, [Ari]? It sets the tone for your day. Here, take this."

[breakfast_2]
refresh = "1y"
requires = [
	{ npc = "valen" },
	{ time_of_day = "morning" },
	{ any = [{ valen_activity = "eat" }, { valen_activity = "order_food" }] },
	{ valen_heart_level = 4, comparator = ">=" }
]
portrait = "neutral"
local = "A balanced breakfast opens the door to a balanced day."
next = "1"

[breakfast_2.1]
portrait = "raised_eyebrow"
local = "That's what my father used to say, anyway."
