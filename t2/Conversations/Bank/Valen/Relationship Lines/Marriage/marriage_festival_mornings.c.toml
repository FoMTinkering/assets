#SPRING FESTIVAL
[spring_festival]
priority = "max"
refresh = "3m"
requires = [
	{ npc = "valen" },
	{ time_of_day = "morning" },
	{ season = "spring" },
	{ spring_festival_date = "1d", time = "after" },
	{ valen_is_spouse = true },
	{ any = [{ location = "farm" }, { building = "player_home" }] },
	{ valen_morning_greeting = false }
]
writes = [{ valen_morning_greeting = true, expires = "6h" }]
actions = [{ bark = { bark = "cute_face", npc = "valen" } }]
portrait = "neutral"
local = "Goodness, is it the $Spring Festival$ already? How time flies."
next = "1"


[spring_festival.1]
portrait = "think"
local = "I haven't had the time to pick any $Breath of Spring$ this year..."
next = "2"


[spring_festival.2]
portrait = "happy"
local = "But I'll be cheering for you!"


