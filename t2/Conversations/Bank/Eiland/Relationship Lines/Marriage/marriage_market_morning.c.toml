local = "Good morning, [Ari]."
next = "1"


[market_darcy.1]
portrait = "happy"
local = "I'm so glad it's Saturday, I need a treat from Darcy's stall."
next = "2"

[market_darcy.2]
portrait = "wink"
local = "Maybe two!"

