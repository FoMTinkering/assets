# DARCY
[market_darcy]
priority = "max"
refresh = "2m"
requires = [
	{ npc = "eiland" },
	{ time_of_day = "morning" },
	{ day_of_the_week = "saturday" },
	{ eiland_is_spouse = true },
	{ any = [{ location = "farm" }, { building = "player_home" }] },
	{ eiland_morning_greeting = false }
]
writes = [{ eiland_morning_greeting = true, expires = "6h" }]
actions = [{ bark = { bark = "cute_face", npc = "eiland" } }]
