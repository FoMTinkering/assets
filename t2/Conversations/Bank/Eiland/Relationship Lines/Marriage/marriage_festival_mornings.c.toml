#SPRING FESTIVAL
[spring_festival]
priority = "max"
refresh = "3m"
requires = [
	{ npc = "eiland" },
	{ time_of_day = "morning" },
	{ season = "spring" },
	{ spring_festival_date = "1d", time = "after" },
	{ eiland_is_spouse = true },
	{ any = [{ location = "farm" }, { building = "player_home" }] },
	{ eiland_morning_greeting = false }
]
writes = [{ eiland_morning_greeting = true, expires = "6h" }]
actions = [{ bark = { bark = "heart", npc = "eiland" } }]
portrait = "neutral"
local = "Good morning, [Ari]."
next = "1"


[spring_festival.1]
portrait = "happy"
local = "The $Spring Festival$ is today! "
next = "2"


[spring_festival.2]
portrait = "wink"
local = "It should be lots of fun, there's so many seasonal treats to enjoy! "


