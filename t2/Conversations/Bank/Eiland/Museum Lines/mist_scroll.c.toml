[mist_scroll]
refresh = "1y"
requires = [
	{ npc = "eiland" },
	{ museum_donated_mist_scroll = true },
	{ building = "museum", comparator = "!=" },
]
portrait = "neutral"
local = "I set out to translate that $Mist Scroll$ you so generously donated to the Museum's collection..."
next = "1"

[mist_scroll.1]
portrait = "mad"
local = "But the text is constantly changing! By the time I've looked up a diacritic, it's moved on!"
next = "2"

[mist_scroll.2]
portrait = "think"
local = "I'll keep at it, though. Sometimes, persistence is the key to a good discovery!"