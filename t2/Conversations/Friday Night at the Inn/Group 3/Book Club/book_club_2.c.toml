[book_club_2.1]
speaker = "elsie"
portrait = "neutral"
local = "I've been dying to talk about this book all week! I started reading right after our last session, and I couldn't put it down! The twists! The turns!"
next = "2"

[book_club_2.2]
speaker = "ryis"
portrait = "think"
local = "I love a closed room mystery, and setting it on a ship was so cool."
next = "3"

[book_club_2.3]
speaker = "ryis"
portrait = "mad"
local = "When they said the first murder happened on the deck, where it was impossible to hide... I was captivated. I started keeping a journal!"
next = "4"

[book_club_2.4]
speaker = "landen"
portrait = "neutral"
local = "Then Ryis and I got to talking about it, and we started pinning notes to the wall in my room. I woke up and went to sleep staring at that thing!"
next = "5"

[book_club_2.5]
speaker = "landen"
portrait = "mad"
effect = "shock"
local = "I was a man possessed! I couldn't figure it out!"
next = "6"

[book_club_2.6]
speaker = "terithia"
portrait = "neutral"
local = "The writer also had all the little nautical details down pat. The absentee pennant, the fake murder weapon hidden in the bilge, the landlubber knots being a clue..."
next = "7"

[book_club_2.7]
speaker = "terithia"
portrait = "happy"
local = "It was very convincing!"
next = "8"

[book_club_2.8]
speaker = "landen"
portrait = "think"
local = "And who would have thought the butler was the murderer? Not me! But it all made sense..."
