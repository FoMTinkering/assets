[board_games_2.2]
speaker = "eiland"
portrait = "wink"
local = "But I have, Nora! It's my duty to preserve these historical buildings. I'm leaving them intact."
next = "3"

[board_games_2.3]
speaker = "nora"
portrait = "sad"
effect = "sweat"
local = "But you had it all declared landmarks! No one has any place to live!"
next = "4"

[board_games_2.4]
speaker = "holt"
portrait = "mad"
local = "That's why Celine and I pooled our black market bucks to get around the law. You see, Eiland may have bought the buildings, but I bought the deeds to the land."
next = "5"

[board_games_2.5]
speaker = "holt"
portrait = "happy"
local = "I'm going to level it to make room for my newest development... an amusement park!"
next = "6"

[board_games_2.6]
speaker = "holt"
portrait = "wink"
local = "Welcome... to Holtland."
next = "7"

[board_games_2.7]
speaker = "celine"
portrait = "mad"
local = "You said we'd call it Celineland!"
next = "8"

[board_games_2.8]
speaker = "valen"
portrait = "sad"
local = "For a silly little board game, it certainly induces people to act unlike themselves."
next = "9"

[board_games_2.9]
speaker = "valen"
portrait = "ugh"
local = "It raises the collective blood pressure of the table, too..."
next = "10"

[board_games_2.10]
