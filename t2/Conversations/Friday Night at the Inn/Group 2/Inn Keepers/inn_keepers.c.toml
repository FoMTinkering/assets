[inn_keepers_josephine]
priority = "max"
refresh = "never"
requires = [
	{ day_of_the_week = "friday" },
	{ any = [
		{ josephine_zone = "inn/bar" },
		{ josephine_zone = "inn/kitchen" },
		{ location = "inn" },
		# remove when zones are fixed
	] },
	{ npc = "josephine" },
	{ juniper_zone = "inn/balcony_hang" },
	{ terithia_zone = "inn/balcony_hang" },
	{ fnati = 1, comparator = ">=" },
	{ fnati = 2, comparator = "<=" },
]
writes = [{ josephine_second_fnati = 1 }]
local = "Juniper and Terithia look thick as thieves up there on the balcony! What do you suppose they're talking about?"

