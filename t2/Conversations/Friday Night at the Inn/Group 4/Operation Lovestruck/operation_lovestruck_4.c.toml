[operation_lovestruck_4.1]
speaker = "elsie"
portrait = "mad"
local = "You've found Penelope, and she wasn't captured at all! She fell in love with the agent of a rival nation, and fled because her handler, Hans, branded her a traitor."
next = "2"

[operation_lovestruck_4.2]
speaker = "elsie"
portrait = "sad"
local = "In fact, Penelope seems quite repentant. And torn. She loved Chip Rosewood's reliable experience, and adored Anelace's boundless curiosity."
next = "3"

[operation_lovestruck_4.3]
speaker = "elsie"
portrait = "embarrassed"
local = "She was fascinated by Goldwolf's stories of her barbarian homeland, and she was enthralled by the strength of Rocky's brain."
next = "4"

[operation_lovestruck_4.4]
speaker = "landen"
portrait = "embarrassed"
local = "Sigh... she always was a sweetheart, that Penelope. Well, folks... I think we know what we have to do."
next = "5"

[operation_lovestruck_4.5]
speaker = "juniper"
portrait = "embarrassed"
local = "Goldwolf hates betrayal... but loves the juicy drama of forbidden love. Goldwolf votes to keep Hans at bay, so Penny and her newest flame can escape."
next = "6"

[operation_lovestruck_4.6]
speaker = "olric"
portrait = "mad"
local = "I use my powerful brain to headbutt the bad guy, so Anelace has time to cast a cool spell!"
next = "7"

[operation_lovestruck_4.7]
speaker = "valen"
portrait = "mad"
local = "The precepts of my magical school demand that I help anyone in need. I weave a spell of memory obliteration on the spy handler."
next = "8"

[operation_lovestruck_4.8]
speaker = "valen"
portrait = "raised_eyebrow"
local = "Unless Goldwolf objects?"
next = "9"

[operation_lovestruck_4.9]
