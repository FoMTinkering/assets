[operation_lovestruck_3.7]
speaker = "olric"
portrait = "mad"
local = "I'm on it! I call on the teachings of Musculor the muscle god to activate the hidden potential of my glutes."
next = "8"

[operation_lovestruck_3.8]
speaker = "olric"
portrait = "neutral"
effect = "sparkles"
local = "I vault over the crowd, kicking off of a fruit stand so I can grab one of those melons in mid-air! I roll to throw it at him!"
next = "9"

[operation_lovestruck_3.9]
speaker = "elsie"
portrait = "wink"
local = "Your roll isn't high, but this is so delightful I'll allow it. The mighty melon sends the man prone. He's startled, and covered in a fine patina of cantaloupe."
next = "10"

[operation_lovestruck_3.10]
speaker = "valen"
portrait = "wink"
local = "His disorientation is an advantage for my spell of truth! I weave it around him before he has a chance to get his thoughts in order."
