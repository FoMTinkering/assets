portrait = "mad"
local = "Penelope Lovestruck was a spy for the crown, and this man is Hans, her handler! If she's missing, it means something's gone terribly wrong."
next = "15"

[operation_lovestruck_3.15]
speaker = "elsie"
portrait = "neutral"
local = "Hans wants to recruit you to a clandestine effort to get Penelope back... Operation: Lovestruck!"
next = "16"

[operation_lovestruck_3.16]
