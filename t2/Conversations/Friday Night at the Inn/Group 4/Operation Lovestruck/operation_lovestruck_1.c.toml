[operation_lovestruck_1.2]
speaker = "elsie"
portrait = "neutral"
local = "Now, I'll set the scene. You're all at the same restaurant, awaiting the arrival of your respective dates. The atmosphere is cheerful, and you've got to chatting."
next = "3"

[operation_lovestruck_1.3]
speaker = "elsie"
portrait = "embarrassed"
local = "The waiter poses a friendly question: Who are you? and what is it that you love about your secret date?"
next = "4"

[operation_lovestruck_1.4]
speaker = "landen"
portrait = "wink"
local = "The name's Chip Rosewood, retired detective. It's hard to find someone who really gets you in my line of work. And according to this here note card, she knows how to hold her liquor to boot!"
next = "5"

[operation_lovestruck_1.5]
speaker = "valen"
portrait = "embarrassed"
local = "I am known as the sorceress Anelace. My darling has an inquisitive mind! She always asks after my latest spells, and she's even inspired me to create some new ones... apparently."
next = "6"

[operation_lovestruck_1.6]
speaker = "juniper"
portrait = "angry_brows"
local = "I'm Goldwolf, a barbarian warrior! Goldwolf loves her girlfriend because she's hotter than the volcanoes that rise above her homeland."
next = "7"

[operation_lovestruck_1.7]
speaker = "olric"
portrait = "neutral"
local = "Right on, Goldwolf. I'm Rocky, a wandering monk who worships the buffest god, Musculor. I met my girl at the monastery gym! She's strong!"
next = "8"

[operation_lovestruck_1.8]
speaker = "elsie"
portrait = "think"
local = "The waiter listens raptly, until he's distracted by a messenger with a letter. He frowns, and reads the letter aloud."
