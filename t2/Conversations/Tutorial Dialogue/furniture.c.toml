[furniture_pickaxe_dell]
priority = "max"
refresh = "never"
requires = [
	{ npc = "dell" },
	{ had_item_pick_axe_worn = true },
	{ furniture_pickaxe_ms_line = false }
]
writes = [{ furniture_pickaxe_ms_line = true }]
portrait = "neutral"
local = "A thoughtful strike with a pickaxe is a great way to move any furniture you have placed, [Ari]."
next = "1"

[furniture_pickaxe_dell.1]
portrait = "think"
local = "I wonder who figured out you could do that in the first place..."

