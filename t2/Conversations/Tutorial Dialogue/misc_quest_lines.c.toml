kind = "gameplay_triggered"
speaker = "adeline"
portrait = "neutral"
local = "You finished meeting everyone in town? That's wonderful! Congratulations on completing your first $Request$. Here's your reward!"

[meet_the_new_vendors_turn_in]
kind = "gameplay_triggered"
speaker = "nora"
portrait = "neutral"
local = "Hey [Ari]! I take it you met our newest vendors."
