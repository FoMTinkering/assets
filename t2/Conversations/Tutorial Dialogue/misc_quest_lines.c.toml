portrait = "happy"
local = "Here's a little thank you again for all your hard work. Why not spend it at one of the new vendor's booths?"

[friday_at_the_sleeping_dragon_inn_turn_in]
kind = "gameplay_triggered"
writes = [{ fnati_follow_up = true, expires = "24h" }]
speaker = "reina"
portrait = "happy"
local = "You made it! What did I tell you, it's a full house! Why don't you go around and see what everyone's up to? Oh, and here's your free drink!"

[friday_at_the_sleeping_dragon_inn_too_early]
refresh = "never"
