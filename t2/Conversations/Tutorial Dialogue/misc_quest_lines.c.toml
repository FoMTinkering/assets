[gossip_for_elsie_turn_in.6]
portrait = "think"
local = "I always assumed the damp attracted them in..."
next = "7"

[gossip_for_elsie_turn_in.7]
portrait = "wink"
local = "But it turns out that $Juniper$ is just fond of =Newts=! Who would have guessed?"
next = "8"

[gossip_for_elsie_turn_in.8]
portrait = "happy"
local = "This chat has been most delightful."
next = "9"

[gossip_for_elsie_turn_in.9]
portrait = "neutral"
local = "If you're ever in the mood for a bit of daily gossip, do stop by."
next = "10"

[gossip_for_elsie_turn_in.10]
