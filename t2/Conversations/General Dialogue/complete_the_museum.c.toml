[complete_the_museum_turn_in]
kind = "gameplay_triggered"
speaker = "errol"
portrait = "happy"
actions = [{ bark = { npc = "errol", bark = "cute_face" } }]
local = "Please accept my most heartfelt thanks, [Ari]. Your diligent effort has filled all four wings of the Museum!"
next = "1"

