[grave_follow_up_hayden]
refresh = "never"
requires = [
	{ npc = "hayden" },
	{ greta = "read" },
	{ grave_text_delay = false }
]
portrait = "neutral_arm_down"
local = "I meant to thank you, [Ari]."
next = "1"

[grave_follow_up_hayden.1]
portrait = "gloomy"
local = "It'd been ages since the last time I could visit my grandmother's grave..."
next = "2"

[grave_follow_up_hayden.2]
portrait = "neutral_arm_down"
local = "Now that the Deep Woods are accessible again, I was able to stop by."
next = "3"

[grave_follow_up_hayden.3]
portrait = "think"
local = "I'm thinking maybe I'll grow some flowers to bring next time."

[grave_follow_up_josephine]
refresh = "never"
requires = [
	{ npc = "josephine" },
	{ jade_and_olin = "read" },
	{ josephine_zone = "<march_zone>", comparator = "!=" },
	{ josephine_zone = "<olric_zone>", comparator = "!=" },
]
portrait = "happy"
local = "Nice to see you, [Ari]. How are you doing?"
next = "1"

[grave_follow_up_josephine.1]
portrait = "neutral"
local = "Ah, so you visited the $Grove of Rest$?"
next = "2"

[grave_follow_up_josephine.2]
portrait = "happy"
local = "It's such a peaceful place. I'm glad we're finally able to access it again."
next = "3"

[grave_follow_up_josephine.3]
portrait = "think"
local = "Jade and Olin? Yes, March and Olric's parents, rest their souls."
next = "4"

[grave_follow_up_josephine.4]
portrait = "neutral"
local = "Jade was easily one of the best blacksmiths in the Kingdom. You wouldn't believe the pieces she'd create!"
next = "5"

[grave_follow_up_josephine.5]
portrait = "think"
local = "Back then, the Mines provided easy access to materials. It made Mistria the perfect spot for them to settle down and start their business."
next = "6"

[grave_follow_up_josephine.6]
portrait = "neutral"
local = "Jade would craft all kinds of items for Olin to export. They would sell them on trips across the sea while Olric looked after little March."
next = "7"

[grave_follow_up_josephine.7]
portrait = "sad"
local = "It was on one of those voyages that a storm struck suddenly... They never made it home."
next = "8"

[grave_follow_up_josephine.8]
portrait = "embarrassed"
local = "I- I'm sorry, dear. I do go on sometimes..."
next = "9"

[grave_follow_up_josephine.9]
portrait = "neutral"
local = "But you know, I think they'd both be really proud of their boys if they were here today. I certainly am."

[grave_follow_up_olric]
refresh = "never"
requires = [
	{ npc = "olric" },
	{ jade_and_olin = "read" },
	{ grave_text_delay = false }
]
actions = [{ bark = { bark = "ellipses", npc = "olric" } }]
portrait = "neutral"
local = "Hey [Ari], what's up?"
next = "1"

[grave_follow_up_olric.1]
portrait = "happy"
local = "I meant to thank you for clearing the path to the Deep Woods."
next = "2"

[grave_follow_up_olric.2]
portrait = "think"
local = "It's been a while since I could visit mom and dad..."
next = "3"

[grave_follow_up_olric.3]
portrait = "embarrassed"
local = "Maybe I can convince March to come with me one of these days!"
next = "4"

[grave_follow_up_olric.4]
portrait = "sad"
local = "He'd never agree to come with me when we were younger."

[grave_follow_up_terithia]
refresh = "never"
requires = [{ npc = "terithia" }, { jade_and_olin = "read" }]
actions = [{ bark = { bark = "ellipses", npc = "terithia" } }]
portrait = "neutral"
local = "Ahoy there, [Ari]. What's on your mind?"
next = "1"

[grave_follow_up_terithia.1]
portrait = "think"
local = "Olin? Now there's a name I haven't heard in a long time..."
next = "2"

[grave_follow_up_terithia.2]
portrait = "neutral"
local = "Yes, yes. March and Olric's father. He was one heck of a sailor. A real entrepreneur too."
next = "3"

[grave_follow_up_terithia.3]
portrait = "happy"
local = "And his wife, Jade, what a talented blacksmith! They made quite the pair."
next = "4"

[grave_follow_up_terithia.4]
portrait = "think"
local = "I remember the night they left... Their small ship loaded up with cargo, ready to sell it across the sea."
next = "5"

[grave_follow_up_terithia.5]
portrait = "sad"
local = "My heart just about broke when they didn't make it back."
next = "6"

[grave_follow_up_terithia.6]
portrait = "think"
local = "And their young boys... losing both their parents like that..."
next = "7"

[grave_follow_up_terithia.7]
portrait = "sad"
local = "Well, it doesn't bear remembering."

[grave_follow_up_valen]
refresh = "never"
requires = [
	{ npc = "valen" },
	{ greta = "read" },
	{ grave_text_delay = false }
]
portrait = "neutral"
local = "Hello, [Ari]."
next = "1"

[grave_follow_up_valen.1]
portrait = "think"
local = "Greta? Hayden's grandmother? Why do you ask?"
next = "2"

[grave_follow_up_valen.2]
portrait = "neutral"
local = "Ah, yes. The $Grove of Rest$ is accessible again now, isn't it? I haven't had a chance to visit yet."
next = "3"

[grave_follow_up_valen.3]
portrait = "happy"
local = "Greta was a lovely woman. I remember back when we were kids, she used to have all sorts of treats waiting when I'd go over to play."
next = "4"

[grave_follow_up_valen.4]
portrait = "neutral"
local = "No one could make a pie like Greta. It must be why Hayden likes them so much!"
