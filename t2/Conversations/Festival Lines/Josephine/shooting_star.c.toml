	{ npc = "josephine" },
	{ shooting_star_date_status = "march_went" },
	{ shooting_star_festival_date = "6d", time = "after" },
	{ march_is_partner = false },
]
portrait = "neutral"
local = "Oh, you wanted to ask me something? What is it, dear?"
prompts = [
	{ local = "What exactly is the deal with March?", next = "1" },
	{ local = "Is there something I should know about March's family?", next = "1" },
]

