[surprise]
refresh = "3m"
priority = "max"
requires = [
	{ npc = "juniper" },
	{ spring_festival_date = "1d", time = "after" },
]
portrait = "happy"
local = "Isn't this festival a pleasant surprise? It's nice to see Dozy enjoying himself."

[first_place]
refresh = "3m"
priority = "max"
requires = [
	{ npc = "juniper" },
	{ spring_festival_date = "1d", time = "after" },
	{ any = [{ sf_first_place = true }, { sf_first_place_plus = true }] },
]
portrait = "happy"
local = "Congrats, I suppose. It's nice to see you embracing the rustic traditions that make Mistria so positively... quaint."
next = "1"

[first_place.1]
portrait = "laugh"
local = "Oh ho ho!"

