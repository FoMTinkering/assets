	{ juniper_heart_level = 6, comparator = "<" },
	{ any = [{ sf_second_place = true }, { sf_third_place = true }] },
]
portrait = "sly"
local = "Well it seems you had fun picking flowers! How lovely."
next = "1"

[middle_place_low_hearts.1]
portrait = "laugh"
local = "Oh ho ho!"

[middle_place_high_hearts]
refresh = "3m"
priority = "max"
requires = [
	{ npc = "juniper" },
	{ spring_festival_date = "1d", time = "after" },
	{ juniper_heart_level = 6, comparator = ">=" },
	{ any = [{ sf_second_place = true }, { sf_third_place = true }] },
]
