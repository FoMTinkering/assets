[shooting_star_anticipation]
refresh = "never"
requires = [
	{ npc = "juniper" },
	{ shooting_star_festival_date = "3d", time = "before" },
	{ quest_repair_the_summit_stairs_complete = true },
	{ juniper_heart_level = 4, comparator = ">=" },
	{ juniper_heart_level = 8, comparator = "<" },
]
portrait = "think"
local = "It seems that it's almost time for another of the village's quaint gatherings..."
next = "1"

[shooting_star_anticipation.1]
portrait = "sly"
local = "This Shooting Star Festival... I'm interested to see it for myself."

[shooting_star_not_invited]
