[shooting_star_anticipation]
refresh = "never"
requires = [
	{ npc = "ryis" },
	{ shooting_star_festival_date = "3d", time = "before" },
	{ quest_repair_the_summit_stairs_complete = true },
	{ ryis_heart_level = 4, comparator = ">=" },
	{ ryis_heart_level = 8, comparator = "<" },
]
portrait = "neutral"
local = "I've noticed the birds are more active in the evenings lately. They seem to be full of energy."
next = "1"

[shooting_star_anticipation.1]
portrait = "think"
local = "Do you think it has something to do with the upcoming Shooting Star Festival?"
next = "2"

[shooting_star_anticipation.2]
portrait = "happy"
local = "Animals are sensitive to the cycles of nature..."
next = "3"

[shooting_star_anticipation.3]
portrait = "embarrassed"
local = "People, too, I suppose."

