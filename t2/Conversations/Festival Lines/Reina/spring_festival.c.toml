[stop_by]
refresh = "3m"
priority = "max"
requires = [
	{ npc = "reina" },
	{ spring_festival_date = "1d", time = "after" },
]
portrait = "neutral"
local = "Be sure to stop by Maple's refreshment stand! She worked really hard on it."
