	{ npc = "reina" },
	{ spring_festival_date = "1d", time = "after" },
	{ any = [{ sf_first_place = true }, { sf_first_place_plus = true }] },
]
portrait = "happy"
local = "First place! I can't believe you knocked Celine off her throne! Next year I bet you're going to have a real fight on your hands."
