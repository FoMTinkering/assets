[shooting_star_anticipation]
refresh = "never"
requires = [
	{ npc = "reina" },
	{ shooting_star_festival_date = "3d", time = "before" },
	{ quest_repair_the_summit_stairs_complete = true },
	{ reina_heart_level = 4, comparator = ">=" },
	{ reina_heart_level = 8, comparator = "<" },
]
portrait = "neutral"
local = "Are you looking forward to the Shooting Star Festival, [Ari]?"
next = "1"

[shooting_star_anticipation.1]
portrait = "think"
local = "I've heard couples often go to watch them up at the Summit..."
next = "2"

[shooting_star_anticipation.2]
portrait = "blush"
local = "Sounds pretty romantic, huh?"

