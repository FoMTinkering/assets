]
no_speaker = true
local = "You feel compelled to talk to Caldarus' Statue."
next = "1"

[shooting_star_caldarus_statue.1]
speaker = "caldarus"
local = "[Ari]... Were you not going to watch the stars with someone tonight?"
next = "2"

[shooting_star_caldarus_statue.2]
speaker = "caldarus"
local = "Would you like to watch them with... me?"
prompts = [
	{ local = "Yes! That's why I'm here!", next = "3" },
	{ local = "I think I'm actually going to head to bed.", next = "11" }
]

[shooting_star_caldarus_statue.3]
speaker = "caldarus"
local = "I do not recall the last time I watched the stars with someone else..."
next = "4"

[shooting_star_caldarus_statue.4]
speaker = "caldarus"
local = "You are very kind to think of me. Let us enjoy them for a moment, shall we?"
next = "5"

[shooting_star_caldarus_statue.5]
speaker = "caldarus"
local = "..."
next = "6"

[shooting_star_caldarus_statue.6]
speaker = "caldarus"
local = "They are beautiful, are they not? How nostalgic."
next = "7"

[shooting_star_caldarus_statue.7]
speaker = "caldarus"
local = "This night has always been auspicious for linking destinies."
next = "8"

[shooting_star_caldarus_statue.8]
speaker = "caldarus"
local = "I am reminded how grateful I am to share one with you."

[shooting_star_caldarus_statue.11]
speaker = "caldarus"
local = "Of course, [Ari]. You must be tired after a long day."
next = "12"

[shooting_star_caldarus_statue.12]
speaker = "caldarus"
local = "Sleep well."

