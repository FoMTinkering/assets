# NEW ROMANCE LINE FOLLOW UPS
[shooting_star_romantic_follow_up_A]
refresh = "never"
requires = [
	{ npc = "hayden" },
	{ shooting_star_date_status = "hayden_went" },
	{ shooting_star_festival_date = "2w 1d", time = "after" },
	{ year_time = "2m 1d", comparator = ">", parser = "date_time" },
	{ shooting_star_gate = false },
	{ hayden_is_partner = false }
]
writes = [{ shooting_star_gate = true, expires = "2d" }]
actions = [{ bark = { bark = "cute_face", npc = "hayden" } }]
portrait = "happy"
local = "Well if it isn't [Ari]! I have a little something for you..."
next = "1"

[shooting_star_romantic_follow_up_A.1]
portrait = "embarrassed"
local = "It's nothing special. I just thought you might like to try some of the =Apple Pie= I made. It's an old family recipe!"
next = "2"

[shooting_star_romantic_follow_up_A.2]
portrait = "blush"
actions = [{ item = "apple_pie" }]
local = "I hope you like it."

