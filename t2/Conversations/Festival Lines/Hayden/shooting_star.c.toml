[shooting_star_anticipation]
refresh = "3m"
requires = [
	{ npc = "hayden" },
	{ shooting_star_festival_date = "3d", time = "before" },
	{ quest_repair_the_summit_stairs_complete = true },
	{ hayden_heart_level = 4, comparator = ">=" },
	{ hayden_heart_level = 8, comparator = "<" },
]
portrait = "think"
local = "I always wonder what my animals think about the Shooting Star Festival..."
next = "1"

[shooting_star_anticipation.1]
portrait = "happy"
local = "Henrietta always seems like she'd try to fly up and eat the stars out of the sky if she could."

[shooting_star_invited]
priority = "max"
refresh = "3m"
requires = [
	{ npc = "hayden" },
	{ hayden_is_at = "town/star_festival_hayden" },
	{ shooting_star_festival_date = "1d", time = "after" },
	{ shooting_star_date_status = "hayden_invited" },
]
portrait = "happy"
local = "Hey, [Ari]!"
next = "1"

[shooting_star_invited.1]
portrait = "think"
local = "Juniper and Dozy are going to babysit Henrietta for the night."
next = "2"

[shooting_star_invited.2]
portrait = "blush"
local = "Are you ready to head up to the Summit?"

