[shooting_star_anticipation]
refresh = "never"
requires = [
	{ npc = "balor" },
	{ shooting_star_festival_date = "3d", time = "before" },
	{ quest_repair_the_summit_stairs_complete = true },
	{ balor_heart_level = 4, comparator = ">=" },
	{ balor_heart_level = 8, comparator = "<" },
]
portrait = "think"
local = "Jo filled me in on the details of the upcoming Shooting Star Festival..."
next = "1"

[shooting_star_anticipation.1]
portrait = "wink"
local = "Apparently the view of the stars is clearest here in Mistria. I'm curious to see it for myself!"

[shooting_star_not_invited]
refresh = "3m"
priority = "max"
requires = [
	{ npc = "balor" },
	{ balor_is_at = "town/star_festival_balor" },
	{ shooting_star_festival_date = "1d", time = "after" },
	{ shooting_star_date_status = "balor_invited", comparator = "!=" },
]
portrait = "neutral"
local = "I've seen these shooting stars from the road and from the Capital..."
next = "1"

[shooting_star_not_invited.1]
portrait = "happy"
local = "But they really are clearest in Mistria!"

