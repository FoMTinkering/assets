# NEW ROMANCE LINE FOLLOW UPS

[shooting_star_romantic_follow_up_A]
refresh = "never"
requires = [
	{ npc = "balor" },
	{ shooting_star_date_status = "balor_went" },
	{ shooting_star_festival_date = "2w 1d", time = "after" },
	{ year_time = "2m 1d", comparator = ">", parser = "date_time" },
	{ shooting_star_gate = false },
	{ balor_is_spouse = false }
]
writes = [{ shooting_star_gate = true, expires = "2d" }]
actions = [
	{ bark = { bark = "cute_face", npc = "balor" } },
]
portrait = "neutral"
local = "Hey [Ari]!"
next = "1"

[shooting_star_romantic_follow_up_A.1]
portrait = "happy"
local = "I just got back from the Capital. I saw this one bakery that made me think of you..."
next = "2"

[shooting_star_romantic_follow_up_A.2]
portrait = "embarrassed"
actions = [{ item = "big_cookie" }]
local = "So I brought you back a little something."

[shooting_star_romantic_follow_up_B]
