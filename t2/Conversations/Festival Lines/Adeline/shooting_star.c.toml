[shooting_star_anticipation]
refresh = "never"
requires = [
	{ npc = "adeline" },
	{ shooting_star_festival_date = "3d", time = "before" },
	{ quest_repair_the_summit_stairs_complete = true },
	{ adeline_heart_level = 4, comparator = ">=" },
	{ adeline_heart_level = 8, comparator = "<" },
]
portrait = "neutral"
local = "The Shooting Star Festival is coming up, [Ari]! It's a real Mistrian tradition."
next = "1"

[shooting_star_anticipation.1]
portrait = "think"
local = "Though I suppose the stars are visible across the kingdom..."
next = "2"

[shooting_star_anticipation.2]
portrait = "happy"
effect = "cheery"
local = "The best view is definitely here in Mistria."

[shooting_star_not_invited]
priority = "max"
refresh = "3m"
requires = [
	{ npc = "adeline" },
	{ adeline_is_at = "town/star_festival_adeline" },
	{ shooting_star_festival_date = "1d", time = "after" },
	{ shooting_star_date_status = "adeline_invited", comparator = "!=" },
]
portrait = "happy"
local = "How pretty..."
next = "1"

[shooting_star_not_invited.1]
portrait = "think"
local = "I wonder if Mother and Father are watching from the Capital right now, too."

