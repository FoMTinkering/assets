[shooting_star_follow_up_not_invited.1]
portrait = "embarrassed"
local = "She does this every year, but I just don't have the heart to tell her she probably won't find anything."

# NEW ROMANCE LINE FOLLOW UPS
[shooting_star_romantic_follow_up_A]
refresh = "never"
requires = [
	{ npc = "celine" },
	{ shooting_star_date_status = "celine_went" },
	{ shooting_star_festival_date = "2w 1d", time = "after" },
	{ year_time = "2m 1d", comparator = ">", parser = "date_time" },
	{ time_of_day = "morning" },
	{ shooting_star_gate = false },
	{ celine_is_fiance = false },
	{ celine_is_spouse = false }
]
writes = [{ shooting_star_gate = true, expires = "2d" }]
actions = [{ bark = { bark = "cute_face", npc = "celine" } }]
portrait = "neutral"
local = "Good morning! Your timing is perfect."
next = "1"

[shooting_star_romantic_follow_up_A.1]
portrait = "blush_closed_eyes"
local = "It's been getting colder, so I made you a cup of $Hot Chocolate$ to start your day!"
next = "2"

[shooting_star_romantic_follow_up_A.2]
portrait = "embarrassed"
actions = [{ item = "hot_cocoa" }]
local = "I... I hope you like extra marshmallows."

[shooting_star_romantic_follow_up_B]
