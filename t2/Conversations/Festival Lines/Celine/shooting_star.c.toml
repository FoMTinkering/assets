[shooting_star_anticipation]
refresh = "never"
requires = [
	{ npc = "celine" },
	{ shooting_star_festival_date = "3d", time = "before" },
	{ quest_repair_the_summit_stairs_complete = true },
	{ celine_heart_level = 4, comparator = ">=" },
	{ celine_heart_level = 8, comparator = "<" }
]
portrait = "neutral"
local = "I can't believe summer is almost over!"
next = "1"

[shooting_star_anticipation.1]
portrait = "happy"
local = "That means it's almost time for the Shooting Star Festival..."
next = "2"

[shooting_star_anticipation.2]
portrait = "blush_closed_eyes"
local = "Do you have any plans yet, [Ari]?"

[shooting_star_not_invited]
refresh = "3m"
priority = "max"
requires = [
	{ npc = "celine" },
	{ celine_is_at = "town/star_festival_celine" },
	{ shooting_star_festival_date = "1d", time = "after" },
	{ shooting_star_date_status = "celine_invited", comparator = "!=" }
]
portrait = "happy"
local = "The stars are so beautiful..."
next = "1"

[shooting_star_not_invited.1]
portrait = "neutral"
local = "It's like the sky is a garden in bloom."

[shooting_star_invited]
refresh = "3m"
priority = "max"
requires = [
	{ npc = "celine" },
	{ celine_is_at = "town/star_festival_celine" },
	{ shooting_star_festival_date = "1d", time = "after" },
	{ shooting_star_date_status = "celine_invited" }
]
portrait = "embarrassed"
local = "[Ari]! Are you ready to go up to the Summit now...?"

[shooting_star_invited_anticipation]
priority = "max"
refresh = "3m"
requires = [
	{ npc = "celine" },
	{ shooting_star_date_status = "celine_invited" },
	{ shooting_star_festival_date = "1d", time = "after" },
	{ day_time = "8:00pm", comparator = "<" },
	{ celine_is_at = "town/star_festival_celine", comparator = "!=" }
]
portrait = "happy"
local = "Tonight will be fun. I'll see you at 8 pm?"

[shooting_star_follow_up]
priority = "max"
refresh = "3m"
requires = [
	{ npc = "celine" },
	{ shooting_star_date_status = "celine_went" },
	{ shooting_star_festival_date = "2d", time = "after" },
	{ celine_is_partner = false }
]
portrait = "embarrassed"
local = "H-hi [Ari], did you have a nice time last night?"
prompts = [
	{ local = "I did!", next = "1" },
	{ local = "Of course!", next = "1" }
]

[shooting_star_follow_up.1]
portrait = "blush"
local = "I'm so glad! I did too. Thanks again for inviting me."

[shooting_star_8h_follow_up]
priority = "max"
refresh = "3m"
requires = [
	{ npc = "celine" },
	{ shooting_star_date_status = "celine_went" },
	{ shooting_star_festival_date = "2d", time = "after" },
	{ celine_is_partner = true }
]
actions = [{ bark = { bark = "heart", npc = "celine" } }]
portrait = "very_happy"
local = "Last night was fun, wasn't it?"
next = "1"

[shooting_star_8h_follow_up.1]
portrait = "blush"
local = "Let's watch the stars together next year, too."

[shooting_star_missed_follow_up]
priority = "max"
refresh = "3m"
requires = [
	{ npc = "celine" },
	{ shooting_star_date_status = "celine_invited" },
	{ shooting_star_festival_day = false },
	{ shooting_star_festival_date = "2d", time = "after" }
]
portrait = "think"
local = "..."
next = "1"

[shooting_star_missed_follow_up.1]
portrait = "sad"
local = "Is everything okay, [Ari]?"
next = "2"

[shooting_star_missed_follow_up.2]
portrait = "gloomy"
local = "You never showed up last night. Did something happen...?"

[shooting_star_caldarus_follow_up_celine]
priority = "max"
refresh = "3m"
requires = [
	{ npc = "celine" },
