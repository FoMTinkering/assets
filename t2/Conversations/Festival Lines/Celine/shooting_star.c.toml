[shooting_star_follow_up_not_invited]
refresh = "3m"
requires = [
	{ npc = "celine" },
	{ shooting_star_date_status = "celine_invited", comparator = "!=", ignore_priority = true },
	{ shooting_star_date_status = "celine_went", comparator = "!=", ignore_priority = true },
	{ shooting_star_date_status = "juniper_went", comparator = "!=", ignore_priority = true },
	{ shooting_star_festival_day = false },
	{ shooting_star_festival_date = "2d", time = "after" }
]
portrait = "think"
local = "Dell's definitely going to be running around looking for shooting stars with her friends."
