# This contains the default values for all fields a cutscene can have. If you omit any of them from your
# entry, then these values will be what it has!
[default]
	# If the user can skip the cutscene with ESC while it runs
	can_skip = true
	# Whether or not the cutscene should spawn a popup confirmation when the user tries to skip
	confirm_skip = true
	# If true, we use the conversation
	has_conversation = false
	# The physical location in the game that will trigger this cutscene when Ari walks into it (if there is one)
	# You can provide just a location, which will treat the entire room as the boundary box, or supply a boundary box
	# yourself
	trigger = -1
	# The trellis point Ari is placed at when this scene finishes. If -1, she is left wherever the scene placed her
	#
	# If you set this to "previous", Ari will go back to wherever she was when the scene was triggered.
	# also `"bed"` is special to go to Ari's bed for the dying cutscene
	end_position = -1
	# Whether or not this scene can only be played in story mode. This is just to save us developers
	# annoyances when we're not playing in story mode.
	requires_story_mode = false
	# Most cutscenes want the screen to fade out before the scene begins, but some atypical ones won't.
	# Keep in mind that in our game, if the screen is already faded out, a fade out request instantly resolves.
	begin_with_fade_out = true
	# The test that this scene should run in. This must be defined
	test_target = "<n/a>"
	# A quest to start once the scene is finished
	quest_to_start = "<n/a>"
	# A quest to progress once the scene is finished
	quest_to_progress = "<n/a>"
	# confusingly named, this means that when Ari starts the cutscene, she won't automagically
	# be in idle. Use only for cutscenes that are triggered via gameplay so you know what animation
	# she's in.
	do_not_set_idle = false
	# Unlocks a spell after the scene
	spell_to_unlock = "<n/a>"
	# Raises Ari's mana after the scene to the provided number
	mana_to_set = "<n/a>"
	# How many frames into the scene the Skip prompt will show (if the scene is skippable)
	frames_before_skip_prompt = 80
	# How many frames the skip prompt stays visible
	skip_prompt_length = 180
	# If this cutscene is meant to trigger overnight specifically (the caldarus scenes)
	when_sleeping = false
	# Whether or not this cutscene can happen more than once.
	can_repeat = false
	# A specified menu to close after the cutscene, look in GeneratedEnums.gml(control F "Menu") for valid menus to close
	menu_close = -1
	# Allows items to be "dropped" in cutscenes, the objects in items array should have a location (tp/npc/ari).  Items are used in scene as dictated by order
	# So if you have 2 potatos, and the first potato spawns on ari, and the second potato spawns on hayden in the list, the first instance of drop_item will drop to ari,
	# and the second instance will drop on hayden.
	drop_items = []
	# Items that are directly stuffed into Ari's inventory
	# Item objects must have an "item_id", optional fields are "quantity" and "infusion".  Check infusions.toml for valid infusion names.
	given_items = []
	# A list status effects to give a player
	# It must have an "effect", check infusions.toml for valid effect names.
	# It must have an "amount" which modifies the effectiveness of the ailment
	status_effects = []
	# How many free baths you get after a scene (stinky stamina potion)
	baths = 0
	# Sets stats to max
	set_max_hp = false
	set_max_stamina = false
	# Sets stats to a specific value
	set_health_to = -1
	set_stamina_to = -1
	# Sets ari to a valid animation name (Look in PlayerAnimationUtils.gml and control F enum AnimationName for a list of valid names)
	animate = -1
	# Resets the post process, must be set to true if the scene is given a post process in the mist file
	post_process_time_override_reset = false
	# If true, this scene will end the day when its complete
	ends_day = false
	# If set, the clock will jump to the target time after the scene (unless the time has already passed)
	end_time_jump = "<n/a>"
	# A list of sprites correlating to sprites used by assets in the given scene so that they can be made invisible in scene
	invisible_assets = []
	# A list of objects that can be made invisible in a scene
	invisible_objects = []
	# Prevents the EoD menu from shutting down music, so the music in this scene continues through
	# the pan over the farm
	prevent_eod_music_stop = false
	# Forces a heart level to be set, used for seridia and caldarus heart progression until level 6
	heart_level_changes = []
	# If set to false, music that was previously playing in the world is allowed to continue
	cut_off_music = true
	# Whether or not the glyph guide is allowed to render. This does NOT apply to the "Skip" prompt.
	allow_glyph_guide = false
	# Prevents music from playing immediately after the scene and until the next room swap.
	silence_music_after_scene = false
	# The requirements for this scene to fire
	requirements = {}
	# An extra skip confirmation for eight heart events
	romantic_choice_warning = "<n/a>"
	# A tutorial to run after this scene (if it hasn't been seen before)
	post_scene_tutorial = "<n/a>"
	# Objects to be removed after (or during) a scene.
	object_removals = []
	# refreshes the music at the end of the scene
	refresh_music = true
	# a marker for any scene that wants to use `refresh_room_layers()`. additionally makes the scene
	# refresh the room layers once it finishes in case the user skips.
	refreshes_room_layers = false
	# Does all of Ari's chores when the scene is done. Meant for scenes that end your day without
	# the player's knowledge.
	handle_farm_chores = false
	# Ensures that the given_items for a scene only are granted once for scenes that repeat.
	give_items_once = false
    # don't use this unless you're supposed to use this
    manually_triggered_in_morning = true
    # when set, we  kill all objects within the [left, top, right, bottom] area.
    # note: these coordinates should be in *pixels*.
    nuke = false

