[upgrade_the_saturday_market_plaza]
	npc = "nora"
	subject_line = "Saturday Market Expansion"
	local = """[Ari],

Mistria's Gold Rank has resulted in an increased volume of requests to join our Saturday Market. It's an amazing opportunity, but we simply don't have the space!

Will you meet with Adeline and I at the Manor House to discuss the situation? I'd really like to find a way to add a few more stalls to the market!"""

