	requirements = {}
	can_repeat = false
	items = []

[friday_at_the_sleeping_dragon_inn]
	subject_line = "Friday at the Sleeping Dragon Inn"
	local = """Hey [Ari]!

Mistria has a tradition where everyone gathers at the Sleeping Dragon Inn on Friday nights! That's tonight, and this is your invitation!

Meet me at the Inn after 6 PM tonight. Keep me company and I'll throw in a free drink!"""
	npc = "reina"
	quest_to_start = "friday_at_the_sleeping_dragon_inn"
	requirements = { reached_date = { season = "spring", day = 5 } }

[museum_donation_wanted]
	npc = "errol"
	subject_line = "Visit The Museum"
	local = """Dear [Ari],

As the curator of Mistria's Museum, I'm delighted to share that we have unveiled a series of tiered rewards to encourage donations to our collection.

Please stop by the Museum west of town at your earliest convenience."""
	quest_to_start = "museum_donation_wanted"
	requirements = { reached_date = { season = "spring", day = 2 } }

[tea_with_hayden]
	npc = "hayden"
	subject_line = "Let's Have Tea!"
	local = """[Ari],
Can't thank you enough for your work on the Mill!

If you've got time, come on over to my place! I'll put the kettle on and we can talk ranching and raising animals."""
	quest_to_start = "tea_with_hayden"
	requirements = { completed_quest = "repair_the_mill" }

[repair_the_mill]
	npc = "adeline"
	subject_line = "Repairing the Mill"
	local = """[Ari],

The mill was damaged in the earthquake, and it's high time we repaired it!

A working mill is essential to the town and will let you process all sorts of new products.

Meet me in my office up at the Manor House!"""
	quest_to_start = "repair_the_mill"
	requirements = { completed_quest = { quest = "replenishing_mistrias_food_reserves_1", days_after = 3 } }

[cozy_kitchen_unlock]
	npc = "ryis"
	subject_line = "Need a Kitchen Upgrade?"
	requirements = { reached_skill_level = { cooking = 15 } }
	local = """[Ari],

The Level 2 Kitchen is now available at the Carpenter's Shop. You should stop by and check it out!"""

[adept_kitchen_unlock]
	npc = "ryis"
	subject_line = "Need an Even Better Kitchen?"
	requirements = { reached_skill_level = { cooking = 30 } }
	local = """[Ari],

The Level 3 Kitchen is now in stock at the Carpenter's Shop. Stop by when you want to upgrade!"""

[greet_the_vendors]
	npc = "nora"
	subject_line = "Greet the Saturday Market Vendors"
	local = """[Ari],

The Saturday Market is finally back in town!

Please go and introduce yourself to this week's vendors. Then come talk to me for a reward!"""
	quest_to_start = "greet_the_vendors"

	[greet_the_vendors.requirements]
		is_day_type = "saturday"
		completed_quest = "repair_the_bridge"

[the_unusual_seed]
	subject_line = "The Unusual Seed"
	local = """[Ari],

Could you come to my house when you have a moment?

I've got a question about a flower that I hope you can help with!"""
	npc = "celine"
	quest_to_start = "the_unusual_seed"
	requirements = { reached_heart_level = { celine = 2 } }

[the_smell_of_drying_ink]
	subject_line = "Official Town Business"
	local = """[Ari],

You've already taken such a keen interest in so much of the goings on around Mistria, would you be interested in getting a closer look at the inner workings of our government?

Come meet me in my office at the Manor House and be prepared for fun!"""
	npc = "adeline"
	quest_to_start = "the_smell_of_drying_ink"
	requirements = { reached_heart_level = { adeline = 2 } }

[the_stele]
