	subject_line = "Cliffblossom Search"
	local = """[Ari],

The Cliffblossom has so far proven elusive.

I'm planning to do a thorough investigation of the cliffs at the Western Ruins, would you care to meet me there?

If nothing else, I would certainly appreciate your company."""
	quest_to_start = "the_panacea"

	[the_panacea.requirements]
		reached_heart_level.valen = 8
		completed_quest = "an_outside_consultant"

# This is a letter exclusively to help users who patch into 0.14.0 between harvest_festival_setup
# and the festival itself.
[harvest_festival_patch_case]
	npc = "reina"
	subject_line = "Get ready for the Harvest Festival!"
	items = [
		{ item_name = "queen_berry", count = 10 },
	]
	requirements.or = [] # this can never pass, which is what we want!
	local = """[Ari],

The Harvest Festival is coming up on Fall 10!

Be sure to collect as many Queen Berries as you can between now and then. There will be all kinds of prizes to win, a community feast, and even a dance!

Berry collecting normally starts on Fall 7, so I've included a few of my own berries to get you started this year."""

[lost_and_found]
	npc = "adeline"
	subject_line = "Community Improvements"
	quest_to_start = "lost_and_found"
	local = """[Ari],

With Mistria's renown rank continuing to climb, I'd like to call a town meeting to discuss some ways we can improve the community.

We'll be meeting in the Dining Room at the Manor House, and would be delighted if you'd attend!"""

	[lost_and_found.requirements]
		reached_renown_level = 20

[apiaries_and_terrariums]
	npc = "luc"
	subject_line = "Calling all Entomologists!"
	quest_to_start = "apiaries_and_terrariums"
	local = """[Ari]!

Our hard work has finally paid off!

Meet me at the Inn for an incredible insect opportunity!!!"""

	[apiaries_and_terrariums.requirements]
		reached_renown_level = 30

[seed_maker]
	npc = "nora"
	subject_line = "Seed Maker now in stock!"
	local = """[Ari],

I'm excited to share that we have a new item called a "Seed Maker" in stock! You can use it to convert harvested crops and certain forageable plants into seeds.

I thought I'd write to you personally since I bet it'd be helpful to have on your farm.

Why not stop by the General Store and take a look?"""

	[seed_maker.requirements]
		repaired_general_store = true

[artifact_replicator]
	npc = "errol"
	subject_line = "Artifact Replicator"
	local = """Dear [Ari],

As a generous contributor, I wanted you to be the first to know that we have recently installed an Artifact Replicator at the Museum.

This marvelous device takes artifacts and exchanges them for a decorative replica, ideal for placement around your home and farm.

I think you'll find it a most rewarding way to make use of any artifacts that you have already donated, while simultaneously benefiting the museum's back catalog."""

	[artifact_replicator.requirements]
		completed_museum_set_within = "archaeology"

[fish_trap]
	npc = "terithia"
	subject_line = "Fish Trap"
	local = """[Ari],

I've set up a Fish Trap at the pier across the Beach Bridge.

If you've got any Fish Bait to place in it, it's a great spot to hunt down rare fish and other ocean oddities!

The tides bring in all sorts of things to that spot."""

	[fish_trap.requirements]
		repaired_beach_bridge = true

[whatever_your_heart_desires]
	npc = "seridia"
	subject_line = "An invitation."
	quest_to_start = "whatever_your_heart_desires"
	local = """Greetings [Ari],

Please meet me at my temple. There is an important matter that I wish to discuss with you... privately.

Do not keep me waiting."""

	[whatever_your_heart_desires.requirements]
		reached_heart_level = { seridia = 8 }
		world_fact_is.seridia_is_human = true

[auto_feeder]
	npc = "hayden"
	subject_line = "Auto Feeders for sale!"
	local = """Hey, [Ari]!

I have a new innovation from the Capital in stock today! I think you'll find it very useful.

Auto-Feeders are a great way to keep your animals fed and your farm tidy! Just place them in large Barns or Coops and keep them stocked with edible items.

The Auto-Feeder will automatically refill a building's troughs each morning with corresponding quality feed based on the items you put in.

Swing on by my shop if you want to see them yourself!"""

	[auto_feeder.requirements]
		reached_skill_level.ranching = 45

[perpetual_soup_unlocked]
	npc = "reina"
	subject_line = "Perpetual Soup Pot"
	local = """Hey [Ari]!

The Inn's free soup of the day is pretty popular, so why not try making your own at home?

If that sounds fun, we now have a Perpetual Soup Pot for sale at the Inn!

You put pretty much anything edible in it and you'll get soup once per day!"""
	[perpetual_soup_unlocked.requirements]
		repaired_inn = true

[mini_mill]
	npc = "landen"
	subject_line = "Mini Mills now in stock!"
	local = """Dear, [Ari],

I'm excited to share that we now stock placeable Mini-Mills for your farm. What times we live in!

Come on by the Carpenter's Shop if you want to see them for yourself!"""

	[mini_mill.requirements]
		repaired_carpenters_shop = true


[post_final_home_upgrade]
	npc = "landen"
	subject_line = "Customizing Your Home"
	local = """Hey, [Ari]!

Congratulations again on your latest home upgrade.

It's about as big as we can get it now, but if you ever want to change up the exterior, you should stop by the Carpenter's Shop!

We have a number of different looks to choose from, and I'd be happy to help you customize your home's look.
"""
	requirements.has_upper_floor = true


