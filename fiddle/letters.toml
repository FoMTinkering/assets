[adeline_break_up]
	npc = "adeline"
	subject_line = "Let's be friends"
	local = """Dear [Ari],

I've given it a lot of thought, and I think a romantic relationship isn't what's best for me right now.

I just feel like I need to spend some more time focusing on myself. I hope we can remain good friends!"""
	requirements.world_fact_is = [{ adeline_is_ex = true }, { disabled_break_up_content = false }]

[balor_break_up]
	npc = "balor"
	subject_line = "Let's call this what it is"
	local = """Dear [Ari],

You'll always be important to me, but I think it's time we admit that things between us have changed.

The end of romance doesn't have to mean the end of a relationship. I hope we can keep on as friends... you changed me for the better, and I'd still like for you to be in my life."""
	requirements.world_fact_is = [{ balor_is_ex = true }, { disabled_break_up_content = false }]

[caldarus_break_up]
	npc = "caldarus"
	subject_line = "Let us bring this chapter to a close"
	local = """My Dragonsworn,

Our bond runs deep, but I think we perhaps mistook the depth of it for romance.

Getting caught up in the moment has been a uniquely mortal experience... I am glad we could share it together. Let us share our next moment as the best of friends."""
	requirements.world_fact_is = [{ caldarus_is_ex = true }, { disabled_break_up_content = false }]

[celine_break_up]
	npc = "celine"
	subject_line = "Growing apart"
	local = """Dear [Ari],

I want you to know that I've thoroughly enjoyed getting to know you better. While we've had a lot of fun together, I've been feeling that our romance has come to a natural conclusion. Like a flower that only blooms for a short while.

While I'll treasure those memories, I think we're better off just being friends."""
	requirements.world_fact_is = [{ celine_is_ex = true }, { disabled_break_up_content = false }]

[eiland_break_up]
	npc = "eiland"
	subject_line = "Let's leave our romance in the past."
	local = """Dear [Ari],

I think that perhaps we got ourselves swept up in the romance that accompanies all major archeologic discoveries.

I still deeply value our connection, and hope we can continue to remain colleagues and good friends."""
	requirements.world_fact_is = [{ eiland_is_ex = true }, { disabled_break_up_content = false }]

[hayden_break_up]
	npc = "hayden"
	subject_line = "Let's talk"
	local = """Hey [Ari],

I was hoping we could talk. You mean the world to me, but I think we'd be best off putting our romance behind us."""
	requirements.world_fact_is = [{ hayden_is_ex = true }, { disabled_break_up_content = false }]

[juniper_break_up]
	npc = "juniper"
	subject_line = "Let's end things"
	local = """Hey [Ari],

We had fun together, but I think it's about time we ended things. Don't you?

No hard feelings okay? I think we're better off just being friends!"""
	requirements.world_fact_is = [{ juniper_is_ex = true }, { disabled_break_up_content = false }]

[march_break_up]
	npc = "march"
	subject_line = "Hey..."
	local = """Hey [Ari],

Can we talk? I've been thinking about things, and I feel like we should just be friends."""
	requirements.world_fact_is = [{ march_is_ex = true }, { disabled_break_up_content = false }]

[reina_break_up]
	npc = "reina"
	subject_line = "Turning a Page"
	local = """Hey [Ari],

I've been doing some soul searching and I think it would be best if we closed this chapter of our relationship.

My feelings of admiration for you haven't changed, but I'm beginning to realize I may have mistaken them for romance.

I hope we can still be friends!"""
	requirements.world_fact_is = [{ reina_is_ex = true }, { disabled_break_up_content = false }]

[ryis_break_up]
	npc = "ryis"
	subject_line = "Let's break things off"
	local = """[Ari],

Lately, I've been feeling some distance between us. It happens, and I think the grown-up thing to do is to call it what it is and break up.

No hard feelings, okay? I really want to stay friends, if you're cool with it."""
	requirements.world_fact_is = [{ ryis_is_ex = true }, { disabled_break_up_content = false }]

[seridia_break_up]
	npc = "seridia"
	subject_line = "You DARE, worm?"
	local = """Hello worm,

You DARE to toy with my heart? To lead me on?

How delicious... you surprise me at every turn. Naturally, I will presume our continued friendship, unless you inform me otherwise."""
	requirements.world_fact_is = [{ seridia_is_ex = true }, { disabled_break_up_content = false }]

[valen_break_up]
	npc = "valen"
	subject_line = "It's time for closure"
	local = """[Ari],

I've enjoyed what we shared, but I feel the time is right to end things. It is important to recognize when something has run its course.

I hope our friendship will remain intact. I consider you a trusted and valued friend."""
	requirements.world_fact_is = [{ valen_is_ex = true }, { disabled_break_up_content = false }]

