	quest_to_start = "a_rewarding_choice"

	[a_rewarding_choice.requirements]
		reached_heart_level = { adeline = 4 }
		completed_quest = "the_smell_of_drying_ink"

# this letter is for adeline 4h
[adeline_4h_reward_1]
	subject_line = "Thanks Again!"
	local = """[Ari],

Thank you so much for your help yesterday! I know everyone in town will really appreciate these extra materials, and I'm sure you'll put yours to good use.

This was a great choice!"""
