		completed_quest = "upgrade_the_saturday_market_plaza"

[repair_the_bell_tower]
	npc = "zorel"
	subject_line = "Repairing the Bell Tower"
	local = """Hey [Ari],

As a fellow music fan I wanted to ask for your help. Everyone says you can really get things done, and I'm hoping you can help my chances of getting Mistria's Bell Tower repaired.

Can you meet me at the Bell Tower? I've asked for Adeline and Landen to meet us there as well, so we can hopefully figure something out!"""
	quest_to_start = "repair_the_bell_tower"

	[repair_the_bell_tower.requirements]
		reached_renown_level = 90
		completed_quest = { quest = "meet_the_new_vendors", days_after = 1 }

[complete_the_museum_incomplete]
	npc = "errol"
	subject_line = "The Museum"
	local = """Dear [Ari],

Congratulations on the momentous achievement that is Mistril Star Town Rank! I hope you take pride in how large a role you played in this. I, and the whole town, celebrate you!

Knowing you as I do, I suspect you are even now looking for additional challenges. As the Museum's Curator, may I humbly suggest helping us complete our collection?

I believe you will find the task every bit as rewarding as raising Mistria's rank. There is also a generous monetary reward to be had, in the form of 10000 tesserae from the Aldarian Museum Association.
"""
	quest_to_start = "complete_the_museum"
	[complete_the_museum_incomplete.requirements]
		completed_quest = { quest = "reach_mistril_star_town_rank", days_after = 2 }
		invert.received_letter = "complete_the_museum_complete"

[complete_the_museum_complete]
	npc = "errol"
	subject_line = "Congratulations!"
	items = [{ purse = 10000 }, { item_name = "mini_museum_blueprint" }]
	local = """Please accept my most heartfelt thanks, [Ari]. Your diligent effort has filled all four wings of the Museum!

Never in wildest imagination did I ever envision that I would be Curator to a Museum so rich as this one! The collection you have gathered will be celebrated throughout Mistria's history, and your name and deeds will be part of it.

I have included your rewards from the Aldarian Museum Association along with a little something from the Mistrian Historical Society that I hope you will enjoy.
"""
	[complete_the_museum_complete.requirements]
		completed_quest = "complete_the_museum"
