#<============== CHESS SET ==============>
# White chess set
[chess_scroll_bundle]
	name = "Chess Piece Scroll Bundle"
	description = "Use this scroll to unlock the crafting recipes for the Chess Piece Decor set!"
	icon_sprite = "spr_ui_item_setscroll_chesspiece"
	soulbind = "forever"
	set_unlock = "chess_decor_set"
	value = { store = 700 }
	tags = ["scroll", "blacklist_popup"]

