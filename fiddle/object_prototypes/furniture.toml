# note on `collision_grid` and `rule_grid` --
# if not provided, we will generate a collision_grid which is just filled with `"1"`.
# and a `rule_grid` just filled with `"F"`.
#
# if `terrain_grid` is not provided, then we will assume a grid entirely composed of `G` tiles.
# the other options are F!
[default]
	size = [2, 2]
	depth_offset = 0
	mirror_west = true
	# if set to `true`, we will set the depth of this object to the floor *beneath* the shadow layer.
	# use this for rugs and what not.
	depth_to_floor = false
	# This is for nodes which have an on/off. The kitchen's actually *don't* have this on, because they're interacted
	# with in a particular way. The primary user of this will be lights. Took at their tables to learn more.
	# NB: you can only have ONE of the following: interaction_turn_on, bed_kind, is_journal. No light up bed journals!
	interaction_turn_on = false
	# Fill this sub-object out for chests. See `basic_wood_chest` for an example.
	# NB: this occupies the interaction data for a furniture item.
	interaction_chest = false
	# If set to true, this means the object should act as a save point like a journal.
	# NB: you can only have ONE of the following: interaction_turn_on, bed_kind, is_journal. No light up bed journals!
	is_journal = false
	# If set to "single" or "double", this means the object is a bed.
	# NB: you can only have ONE of the following: interaction_turn_on, bed_kind, is_journal. No light up bed journals!
	bed_kind = false
	# if set to to a valid object, it will treat this as a light.
	# then we will also generate a light on top of the window.
	window_tiles = false
	# defines an animal toy. Must be an object with SOME STUFF on it -- we'll decide later!
	animal_toy = false
	# use this to define a given child_grid.
	# Places a grid of flags, dictating where furniture is allowed to go.
	# `child_grid = ["100"]` for example, would allow only a 1x1 furniture item in the left side.
	# For simplicity, you can flood the grid with just `child_grid = "1"` (or 0). The only options are `1` and `0`.
	# Finally, if the grid is explicitly defined, it *must* be the same size as the Object itself.
	child_grid = false
	# meaningful only if a child_grid is defined. This is the pixel offset from which the child_grid is from the top_left
	# grid coordinate.
	child_grid_offset = [0, 0]

	# set to true for things which need fence autotiling
	fence = false

	# set to true for rugs. Rugs are just a wild, second thing in our engine, that we're going to bodge
	# as much as we can.
	rug = false

	# when this is set, and should only be set for rugs, pets will sleep on it.
	pet_bed = false

	# when this is set, and should only be set for pet dishes, pets will eat at it periodically.
	pet_dish = false

	# determines whether or not this furniture can be destroyed by the player
	destructable = true

	# set to an [x, y] offset to mark a place a bird could perch on.
	bird_perch = false

	# for date photos
	is_date_photo = false

	# set to a valid footstep kind to place a foostep directly. this will *not* override any
	# footsteps placed in the world editor, which always win, but it *will* beat any footsteps
	# placed by terrain.
	footstep = false

	# acceptable locations for furniture:
	placeable_locations = [
		"farm",
		"player_home",
		"player_home_west",
		"player_home_east",
		"player_home_upper_central",
		"player_home_upper_west",
		"player_home_upper_east",
		"large_greenhouse",
		"small_greenhouse",
        "mini_museum",
	]

	# when this is set, furniture will only want to be on 2s. This should always be set for things like fences.
	on_twos_only = false

	# when this is set, we check if you check pick the thing based on the player or animals standing on it. this mostly
	# shows up in terrain editing objects!
	check_pick = false

	# this means it can be on a tabletop.
	can_be_child = true

    # gives it an interaction to recover the given amount of stamina/health
    restoration = false

    # if true this is a crystal resonator that can be used to select music for the current room
    is_crystal_resonator = false

    # If provided, a flag with this name is written as 'true' into t2. This is a one way operation;
    # the fact will not be set to false if this object is removed, it will remain true forever.
    write_flag = false

    # If provided, the furniture simply always has a light, light offset, and possibly a `continual_on_sound`.
    # Similar to `interaction_turn_on`, but with no interaction.
    light_always_on = false

