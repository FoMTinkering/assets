		winter = ["spr_weed_small_winter_1", "spr_weed_small_winter_2"]

[leaf_pile]
	collideable = false
	size = [4, 3]
	offset = [8, -3]
	debris_emitter = "leaf_pile"

	[leaf_pile.on_destruction_particles]
		spring = ["spr_illegal_16"]
		fall = [
			"spr_part_weed_small_autumn_1",
			"spr_part_weed_small_autumn_2",
		]

	[leaf_pile.sprites]
		fall = ["spr_farm_leafpile_c1_autumn", "spr_farm_leafpile_c2_autumn"]
		spring = ["spr_illegal_16"]

	[leaf_pile.drops]
		# no drops in spring, but required to have a spring generally right now
		spring = []

		[[leaf_pile.drops.fall]]
			item = "wild_mushroom"
			chance = 20.0
			exclusive = false

