[default]
	collideable = true
	hits = 1
	size = [2, 2]
	offset = [0, -2]
	# this means it never uses the debris emitter
	debris_emitter = false
	# treasure chests and barrels override this to true
	dungeon_only = false
	# only really wilted_plants have this and the game only really cares if wilted plants have this
	sound_on_collide = false
	# minimum tool quality to hit this -- this is a requirement
	# mostly for code cleanliness. no breakable should override this
	minimum_quality = "tier1"
	# this is odd code to dieal with being EITHER a normal seasonal or a dungeon object
	drops = { spring = [], biome_1 = [] }
	sprites = { spring = ["spr_illegal_16"], biome_1 = ["spr_illegal_16"] }
	destruction_sfx = "SoundEffects/Objects/SmallBushDestroy"

	# this means in the mines a ladder can spawn under it
	ladder_candidate = false

	[default.on_destruction_particles]
		spring = ["spr_illegal_16"]
		biome_1 = ["spr_illegal_16"]

[weed]
	collideable = true
	size = [2, 2]
	offset = [0, -2]
	debris_emitter = "bush"

	[weed.drops]
		spring = [
			{ item = "fiber", chance = 50.0 },
		]

	[weed.on_destruction_particles]
		spring = [
			"spr_part_weed_small_spring_1",
			"spr_part_weed_small_spring_2",
		]
