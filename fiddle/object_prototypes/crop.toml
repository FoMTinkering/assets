[default]
	sprites = ["spr_illegal_16"]
	size = [2, 2]
	# `harvest` is inferred from the name of the name (so `acorn` has a `harvest = "acorn"`).
	# you can override that by setting:
	# harvest = "something_else"
	harvest = "<..>"
	day_to_stage = [0]
	# by default, crops offset as `[8, 8]`, which puts their origin at the center of
	# their 2x2 structure. For anything not `2x2` in size, you'll probably want to override `offset`
	offset = [8, 8]
	# If you provide a non-zero regrow_days value, then this crop, isntead of being destroyed on harvest
	# will infinitely regrow.
	regrow_days = 0
	# This is how big the interaction bubble, as a circle, is around stuff.
	interact_size = 4
	# noise we play when we walk over it
	sound_on_collide = "SoundEffects/Objects/TallGrassRustle"
	# How many things to make on harvest
	count = 1
	# If this is true, then non-seeds will sway.
	sways = true
	# this is automatically set to `false` if this is only a single stage crop. If for some reason we
	# have a multi-stage crop which doesn't start as a seed, set to `false`.
	stage_zero_is_seed = true
	# required for each crop
	seasons = -1
	# when a crop is a managed forageable, they always regrow, and it takes them 3 days to do it!
	managed_regrow_days = 3
	# this is for managed forageables only. It's meaningless in every other context. This is the little mound.
	mound_sprite = "spr_forageable_regrow_dirt_spring"
	# this is what we use for the winter
	winter_mound_sprite = "spr_forageable_regrow_dirt_winter"
	# this is a hack for the ice basically!
	mound_sprite_is_floor = false
	# this is the regrow sprite used when spawned as a managed forageable
	managed_regrow_sprite = "spr_forage_sprout_spring"

	# how much animal currency to provide when eaten by animals
	currency = 1

	# any "slow growing crop", used to accelerate their growth by one day with the perk harvest_time in perks.toml
	harvest_time_enabled = false

	# an animated asset related to the crop the variable is connected to
	animated_sprite = false

	# whether or not this is a "plant"
	is_plant = true

