# This entry shows the different fields a fish can have, as well as
# what values they will default to if you do not provide them in your entry.
[default]
	# The item this fish is associated with. If "<..>", we will look for an
	# item with the same name as this fish.
	item = "<..>"
	# The seasons this fish can spawn in. If set to false, it can spawn in
	# all seasons.
	seasons = false
	# The range of hours this fish can spawn in (measured in hours). If set to false,
	# it can spawn any time.
	hours = false
	# The type of water this fish spawns in. Options are river, ocean, and pond.
	water_type = "river"
	# The weather events this fish can spawn in. If set to false, it can spawn in
	# all weathers.
	weather = false
	# The locations this fish can spawn in. If set to false, it can spawn in all
	# locations.
	locations = false
	# The size of this fish, which effects the "water depth" this fish can spawn in.
	# Options are small, medium, large, giant, or any
	size = "small"
	# If this is set to true, then any size is allowable. For diving spots, this is
	# is a good idea.
	any_size = false
	# Whether or not this is a legendary fish.
	legendary = false
	# How rare this fish is (options are common, uncommon, kinda_rare, rare)
	rarity = "common"
	# How do you get this fish (options are fishing, divespot, mines).  Also supports arrays
	retrieval = "fishing"
	# Is this dude a scroll?
	recipe = false
	# Is the fella a chest?
	is_chest = false
	# Is this an artifact that needs a perk to see? currently that's `sunken_secrets` and `aquatic_antiquities`
	perk_artifact = false
	# Does this fish need a perk to spawn?  This should be the name of a perk.
	has_perk = false
	# Indicates this fish spawns from bait exclusively and won't appear in the main fish distributions
	bait_only = false

