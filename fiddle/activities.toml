# Small activities that NPCs can perform around Mistria.
#
# Here are the kinds of activities we currently support:
#
# "trellis_point"
# These activities can be created with just this TOML file. They follow
# a standard behavior:
# 1. Walk to a location
# 2. Play an animations
# 3. End after a certain amount of time
#
# "grid_object"
# These can also be created just with TOML. They follow the same behavior
# as the "trellis_point" kind above, but instead they seek objects on the
# grid that have a given tag (defined in furniture.toml).
#
# "custom_programming"
# These are activities that have unique behavior that the programmers
# hand-write.
#
# "wander"
# This is just used for the wander activity. It makes the NPC choose a random spot in the room and
# walk there.
#
# You can directly request an NPC to perform an activity, or can set
# up a routine in routines.toml.
#
# Below is the default entry which will show you what properties are
# available and what they will default to if not provided.
[default]
	# The number of game-minutes this activity can take to complete.
	# You can set this to "<n/a>" to make the activity indefinite.
	duration_range = [60, 120]
	# The trellis points that are valid for this activity. NPCs will only
	# select ones within their current room. If none are available, the
	# activity will cancel.
	#
	# If you do not provide any trellis points, the NPC will not move as a
	# part of this activity and will simply animate in place.
	trellis_points = []
	# The animations the NPC should play during this activity. You can provide just one ("idle") or an
	# array of random options (["idle", "walk"])
	animations = []
	# The kind of activity, listed towards the top of this file.
	kind = "trellis_point"
	# Used for Saturday Market activities. Providing an NPC will require that vendor to be present at
	# an active Saturday Market for this activity to run.
	required_vendor = "<n/a>"
	# Used for activities that seek grid objects rather than trellis points.
	object_tag = "<n/a>"

