	# harvesting a crop or forageable (including bushes)
	harvest = 0.12
	# digging/picking a dig site
	dig_site = 0.25
	# breaking a rock
	rock_break = 0.11
	# breaking an object with the axe
	axe_break = 0.15
	# when a fish is caught
	fish_caught = 0.33
	# when a dive spot is cleared
	dive_spot = 0.40
	# when a bug is caught
	bug_caught = 0.15
	# each time an animal drops an item overnight
	animal_production = 0.50
	# breaking stuff like bushes and boxes
	slash_breakable = 0.005
	# slashing grass
	slash_grass = 0.004
	# when killing an enemy.
	kill_enemy = 0.33

[xp_values] # exp earned for action
	break_dig_spot = 3
	identify_artifact = 6
	catch_small_fish = 20
	catch_medium_fish = 20
