	# The maximum distance (in pixels) two npcs can be to begin / sustain a conversation.
	max_chat_distance = 48
	# The frequency at which an NPC checks for other NPCs to chat with.
	chat_scan_frequency = 120
	# The number of frames an npc waits before displaying the "..." bark when Ari is blocking their path
	path_block_bark_delay = 180
	# The number of frames an npc waits *after* barking before they just walk around Ari
	path_block_reroute_delay = 300
	# The number of tiles (8x8) that pathfinding characters look ahead while walking to detect "errors". The most
	# common example of this would be the npcs stopping when Ari stands in their way. If the number was set to 2,
	# Ari would need to be within 2 tiles of the Npc for them to stop.
	pathfinding_lookahead = 2

