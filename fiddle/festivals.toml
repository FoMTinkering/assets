[default]
	# The date the festival takes place on
	date = "<n/a>"
	# The icon sprite used to render this festival on the Calendar UI
	icon = "spr_illegal_16"
	# The name of the festival as it should appear in the UI
	name = "MISSING NAME"
	# The challenges (if any) that this festival involves.
	challenges = []
	# The data pertaining to decorating locations. These can rely on tiers within challenges.
	decor = {}
	# The possible cutscenes that can play
	# The stocks for the various vendors at this festival
	stocks = {}
	# The quest associated with this festival
	associated_quest = "<n/a>"
	# Data for date style festivals
	npc_date = "<n/a>"
	# Forced weather conditions for this festival
	forced_weather = "calm"
	# A collection of music tracks that should play in specific locations
	location_music = {}
	# An override for the general daytime playlist
	daytime_music = "<n/a>"
	# The location this festival takes place in
	location = "<n/a>"
	# Whether or not we're done implementing this festival. This is so users can see them on the
	# calendar as upcoming content, and we can keep them here, but they won't have consequences
	implemented = false
	# this is the stringified *gameplay_triggered_conversation* name.
	# confusing, yah?
	festival_post_line = "<n/a>"
	# this is a sprite name for the festival post, such as `spr_town_flag_post_new_years_eve_festival_winter`
	# note: you should set the correct seasonality on the sprite here, we don't handle that for you
	festival_post_sprite = "<n/a>"
	# the local for the npc interaction
	interact_local = "misc_local/interact_invite"
	# if there are any writes for t2 facts, they should go here.
	# these will be written on the day of the festival at 6am
	writes = []

