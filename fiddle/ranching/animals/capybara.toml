[core]
	name = "Capybara"
	plural_name = "Capybara"
	female_other = "a female capybara"
	male_other = "a male capybara"
	new_baby_born = "A new Capybara was born! Enter new name"
	size = "small"
	default_icon_variant = "light_brown"
	cosmetic_sub_icon = "spr_ui_item_sub_animal_capybara"
	requirements = { repaired_haydens_farm = true, reached_date = { season = "winter", day = 1, year = 1 } }

[celebration_data]
	baby_animation = "happy"
	adult_animation = "happy"

[production.male]
	days_to_produce = 3
	normal_product = "bristle"
	golden_product = "golden_bristle"

[production.female]
	days_to_produce = 3
	normal_product = "bristle"
	golden_product = "golden_bristle"

[breeding]
	uses_egg = false
	days_until_adult = 3
	treat = "heart_shaped_capybara_treat"

[eating]
	kind = "seed"
	offset = [18, -2]
	baby_offset = [18, -2]
	shake_frames = [1, 9]

[petting]
	kind = "pick_up"
	held_offset = [9, 15]

[pricing]
	buy_price = 2000
	baby_sell_price = 500
	adult_sell_prices = [
		700,
		750,
		900,
		1000,
		1150,
		1200,
		1400,
		1600,
		2000,
		2200,
		2300,
	]

[mounting]
	is_mount = false

[bark_offsets]
	adult = { north = [2, -28], south = [2, -27], east = [3, -26], west = [0, -26] }
	baby = { north = [2, -23], south = [2, -23], east = [3, -21], west = [1, -21] }

[[sounds.baby]]
	ambient = "SoundEffects/Animals/BabyCapybaraAmbient"
	positive_react = "SoundEffects/Animals/BabyCapybaraPositiveReact"
	negative_react = "SoundEffects/Animals/BabyCapybaraNegativeReact"

[[sounds.adult]]
	ambient = "SoundEffects/Animals/CapybaraAmbient"
	positive_react = "SoundEffects/Animals/CapybaraPositiveReact"
	negative_react = "SoundEffects/Animals/CapybaraNegativeReact"

[animations.idle_2]
	end_with_animation = true
	valid_for = ["male", "female"]

[animations.happy]
	randomly_selected = false

[animations.swim]
	randomly_selected = false
	end_with_animation = false
	valid_for = ["male", "female"]

