[core]
	name = "Duck"
	plural_name = "Ducks"
	female_other = "a female duck"
	male_other = "a male duck"
	new_baby_born = "A new Duck was born! Enter new name"
	size = "small"
	default_icon_variant = "mallard"
	cosmetic_sub_icon = "spr_ui_item_sub_animal_duck"
	requirements = { repaired_haydens_farm = true }

[celebration_data]
	baby_animation = "happy"
	adult_animation = "honk"

[production.male]
	days_to_produce = 3
	normal_product = "duck_feather"
	golden_product = "golden_duck_feather"

[production.female]
	days_to_produce = 1
	normal_product = "duck_egg"
	golden_product = "golden_duck_egg"

[breeding]
	uses_egg = true
	days_until_adult = 3
	treat = "heart_shaped_duck_treat"

[eating]
	kind = "seed"
	offset = [8, -2]
	baby_offset = [4, 0]
	shake_frames = [0, 10]

[petting]
	kind = "pick_up"
	held_offset = [9, 15]

[pricing]
	buy_price = 1500
	baby_sell_price = 375
	adult_sell_prices = [500, 560, 675, 750, 825, 900, 1050, 1200, 1500, 1700, 1800]

[mounting]
	is_mount = false

[bark_offsets]
	adult = { north = [2, -29], south = [2, -29], east = [2, -28], west = [2, -28] }
	baby = { north = [0, -22], south = [2, -22], east = [3, -23], west = [0, -22] }

[[sounds.baby]]
	ambient = "SoundEffects/Animals/BabyDuckAmbient"
	positive_react = "SoundEffects/Animals/BabyDuckPositiveReact"
	negative_react = "SoundEffects/Animals/BabyDuckNegativeReact"

[[sounds.adult]]
	ambient = "SoundEffects/Animals/DuckAmbient"
	positive_react = "SoundEffects/Animals/DuckPositiveReact"
	negative_react = "SoundEffects/Animals/DuckNegativeReact"

[animations.blink]
	end_with_animation = true

[animations.honk]
	end_with_animation = true
	valid_for = ["male", "female"]

[animations.happy]
	end_with_animation = true
	valid_for = ["baby"]

[animations.swim]
	randomly_selected = false
	end_with_animation = false
	valid_for = ["male", "female"]

