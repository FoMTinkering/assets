		{ sfx = "SoundEffects/Tools/AxeDamageTree", cam_trauma = 0.1, node_trauma = 0.7 },
	]

[chop.destroyed]
	cam_trauma = 0.3
	large_stump_sfx = "SoundEffects/Objects/WoodDestroyedLarge"
	stump_sfx = "SoundEffects/Objects/WoodDestroyedMedium"
	branch_sfx = "SoundEffects/Objects/WoodDestroyedSmall"
