		{ sfx = "SoundEffects/Objects/TreeDestroyedSmallest", cam_trauma = 0.1 },
		{ sfx = "SoundEffects/Objects/TreeDestroyedSmaller", cam_trauma = 0.1 },
		{ sfx = "SoundEffects/Objects/TreeDestroyedSmall", cam_trauma = 0.1 },
		{ sfx = "SoundEffects/Objects/TreeDestroyedMedium", cam_trauma = 0.1 },
		{ sfx = "SoundEffects/Objects/TreeDestroyedFullSize", cam_trauma = 0.1 },
	]

[chop.wrong]
