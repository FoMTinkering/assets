axe_pickaxe_swing_sfx = "SoundEffects/Tools/AxeAndPickSwing"
hoe_shovel_swing_sfx = "SoundEffects/Tools/HoeAndShovelSwing"

# you're using the right kind of tool, but it's not upgraded enough
[pick.inadequate]
	sfx = "SoundEffects/Tools/PickInadequateHitRock"
	cam_trauma = 0.3
	node_trauma = 0.5

# You hit a rock but it hasn't been destroyed
[pick.damaged]
	large_sfx = "SoundEffects/Tools/PickDamageRock"
	sfx = "SoundEffects/Tools/PickDamageRock"
	cam_trauma = 0.08
	node_trauma = 0.7

# You hit a rock and its been destroyed
[pick.destroyed]
	large_sfx = "SoundEffects/Tools/PickDestroyRockLarge"
	sfx = "SoundEffects/Tools/PickDestroyRock"
	cam_trauma = 0.3

# wrong tool
[pick.wrong]
	sfx = "SoundEffects/Tools/WrongToolUse"
	cam_trauma = 0.1
	node_trauma = 0.5

[pick.furniture]
	sfx = "SoundEffects/UI/UIUnPlaceBuilding"
	cam_trauma = 0.08

# you're using the right kind of tool, but it's not upgraded enough
[chop.inadequate]
	sfx = "SoundEffects/Tools/AxeInadequateHitWood"
	cam_trauma = 0.3
	node_trauma = 0.5

[chop.damaged]
	cam_trauma = 0.08
	node_trauma = 0.7
	large_stump_sfx = "SoundEffects/Tools/AxeDamageWood"
