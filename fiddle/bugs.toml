# This guy sets the defaults for everyone else. If you omit any of these fields from your bug,
# it will use these values!
[default]
	# Options are "jump", "fly", "fly_wave" and "crawl"
	type = "crawl"
	# The name of the sprite for the bug when idle. "<..>" means that we attempt to find
	# the sprite based on its name at runtime.
	idle_sprite = "<..>"
	# The name of the sprite for the bug when moving. "<..>" means that we attempt to find
	# the sprite based on its name at runtime.
	move_sprite = "<..>"
	# The range of time (in seconds) the bug moves for before pausing
	move_range = [0.3, 2.0]
	# The range of speed (in pixels) the bug moves per frame
	speed_range = [0.0, 0.3]
	# The amount of time (in seconds) the bug spends idle inbetween movements
	idle_range = [2, 5]
	# Whether or not this but emits a light.
	has_light = false
	# The way this bug spawns (options are default, canopy, rock)
	spawn = "default"
	# The seasons this bug can appear in
	seasons = ["spring", "summer", "fall", "winter"]
	# The range of hours this bug can appear in
	hours = [6, 17]
	# The types of weather events the bug can appear in
	weather = ["calm", "special"]
	# How rare this bug is (options are common, uncommon, rare, very_rare)
	rarity = "common"
	# The bug tags for this bug.
	tag = ["standard"]
	# Whether or not this bug can spawn on water. This is currently only for the pond skater.
	can_spawn_on_water = false
	# If specified the bug can only spawn in the listed dungeon biome
	dungeon_biome = -1
	# If true this bug will try to move towards light sources.
	attraction = "none"
	# If this is true, this bug will only be spawned by pheromones and won't be in the regular bug distributions
	pheromones_only = false

