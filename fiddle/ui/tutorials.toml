kinds of Honey based on rarity."""

	[[apiaries_and_terrariums.steps]]
		sprite = "spr_ui_tutorial_apiaries_and_terrariums_3"
		text = """For example, putting 4 Legendary
bees into an Apiary will cause it to
produce Legendary Honey."""

	[[apiaries_and_terrariums.steps]]
		sprite = "spr_ui_tutorial_apiaries_and_terrariums_4"
