Bug Pheromones or Fish Bait."""

	[[apiaries_and_terrariums.steps]]
		sprite = "spr_ui_tutorial_apiaries_and_terrariums_7"
		text = """Bug Pheromones can be used on
open ground to summon a bug
for you to catch."""

	[[apiaries_and_terrariums.steps]]
		sprite = "spr_ui_tutorial_apiaries_and_terrariums_8"
		text = """The rarity of the summoned bug
will match the rarity of the
Bug Pheromone used."""

	[[apiaries_and_terrariums.steps]]
		sprite = "spr_ui_tutorial_apiaries_and_terrariums_9"
		text = """Similarly, Fish Bait can be used
on open water to summon a fish
that you can then catch."""

	[[apiaries_and_terrariums.steps]]
		sprite = "spr_ui_tutorial_apiaries_and_terrariums_10"
		text = """The rarity of the summoned
fish will match the rarity of
the Fish Bait used."""

	[[apiaries_and_terrariums.steps]]
		sprite = "spr_ui_tutorial_apiaries_and_terrariums_11"
		text = """And finally, Fish Bait can also be
used to load the Fish Trap on
the west side of the Beach."""

