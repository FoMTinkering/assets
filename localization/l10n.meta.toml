	# all of these paths have some localization data, so we'll try to find
	# what localization we have and replace what's here with what's in `translations`.
	[asset_properties.fiddle_renames]
		misc_local = ["*"]
		"items/" = ["*/name", "*/description"]
		"museum_wings/" = ["name", "sets/*/name", "sets/*/description"]
		"npcs/" = ["name", "job"]
		"object_prototypes/building" = ["*/name"]
		"quests/" = [
			"*/name",
			"*/description",
			"*/stages/*/objective_description",
			"*/stages/*/turn_in_description",
			"*/stages/*/turn_in_button_label",
		]
		"quests/crown_registry" = ["tag_registrations/*/text"]
		"ranching/animals/" = [
			"core/name",
			"core/plural_name",
			"core/female_other",
			"core/male_other",
			"core/new_baby_born",
			"variants/*/name",
			"cosmetics/*/name",
		]
		"ui/crafting/" = ["categories/*/name", "categories/*/sub_categories/*/name"]
		"ui/character_customization" = ["*/*/name"]
		"ui/skill_menu/" = ["name"]
		"ui/tutorials" = ["*/title", "*/steps/*/text"]
		festivals = ["*/name"]
		letters = ["*/local", "*/subject_line"]
		locations = ["*/name"]
		misc = ["inn/soup_kinds/*"]
		perks = ["*/name", "*/description"]
		renown = ["ranks/*/name"]
		player_assets = ["*/name"]
		stores = ["*/name"]
		infusions = ["*/name", "*/description"]
		"dungeons/dungeons" = ["biomes/*/name"]
		spells = ["*/name", "*/description", "*/type"]
		pets = ["cosmetic_sets/*/name", "variants/*/name"]
		dates = ["*/name", "*/description", "*/photo_title"]
		children = ["*/name"]
		cameos = ["name"]
        songs = ["*/name"]
        bell_sounds = ["*/name"]
